<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <title>Lighthouse — Morning Watch, Night Watch &amp; Prayer Sanctuary</title>

  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Lucide Icons CDN -->
  <script src="https://unpkg.com/lucide@latest"></script>
  <!-- HTML2PDF Bundle CDN (for shared Night Binder PDF Studio) -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=JetBrains+Mono:wght@400;500;600&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  <!-- Shared Lighthouse Styles -->
  <link rel="stylesheet" href="./styles.css" />
</head>
<body class="min-h-screen flex flex-col md:flex-row">
  <script type="module">
    import {
      MORNING_LIBRARY,
      NIGHT_LIBRARY,
      JESUS_PRAYER_THEMES,
      PRAYER_CATEGORY_OPTIONS,
      getLocalIsoDate
    } from './data.js';
    import {
      state,
      saveState,
      renderApp,
      showToast,
      escapeHtml,
      ensureDailyLog,
      openDetailModal,
      initLighthousePage
    } from './core.js';

    // =========================================================================
    // STATION 4: MORNING WATCH & REST (ACTIVE BOARD + 22 CATEGORIZED CARDS)
    // =========================================================================
    function renderMorningView() {
      const categories = [
        'All',
        'Wake-to-Workout (30m Ramp)',
        'Circadian & Neural',
        'Tendon & Mobility',
        'Spiritual Firstfruits',
        'Biblical Rest (Menuha)'
      ];

      const activeBoardCards = (state.morningBoardIds || [])
        .map((id) => MORNING_LIBRARY.find((c) => c.id === id))
        .filter(Boolean);

      const totalBoardMins = activeBoardCards.reduce((sum, c) => sum + (c.durationMins || 0), 0);

      const filteredLibrary =
        state.morningCategoryFilter === 'All'
          ? MORNING_LIBRARY
          : MORNING_LIBRARY.filter((c) => c.category === state.morningCategoryFilter);

      return `
        <div class="space-y-6">
          <!-- DEDICATED MY MORNING WATCH & REST BOARD -->
          <div class="lh-surface rounded-2xl p-4 sm:p-6 space-y-4">
            <div class="flex flex-wrap items-center justify-between gap-3 pb-3 border-b lh-border">
              <div>
                <div class="flex items-center gap-2">
                  <span class="text-[11px] font-semibold uppercase tracking-wider px-2.5 py-0.5 rounded-full lh-badge">Active Morning Board</span>
                  <span class="text-xs font-mono-code lh-text-sec">${activeBoardCards.length} cards • ${totalBoardMins} mins total</span>
                </div>
                <h3 class="text-lg sm:text-xl font-bold lh-text-main mt-1">My Morning Watch &amp; 30-Min Workout Ramp</h3>
                <p class="text-xs lh-text-sec">Tap any card to inspect the neuroscience &amp; Scripture modal, or push your entire board to today’s 24h Watchtower.</p>
              </div>
              <div class="flex flex-wrap gap-2">
                <button onclick="window.Lighthouse.load30MinWorkoutPreset()"
                  class="px-3 py-2 rounded-xl lh-btn-soft text-xs flex items-center gap-1.5">
                  <i data-lucide="zap" class="w-3.5 h-3.5"></i>
                  <span>Load 30m Wake-to-Workout Ramp</span>
                </button>
                <button onclick="window.Lighthouse.pushAllMorningBoardToWatch()"
                  class="px-3.5 py-2 rounded-xl lh-btn-primary text-xs flex items-center gap-1.5">
                  <i data-lucide="calendar-plus" class="w-3.5 h-3.5"></i>
                  <span>Push Board to 24h Watch</span>
                </button>
              </div>
            </div>

            ${
              activeBoardCards.length === 0
                ? `<p class="text-xs lh-text-sec py-4 text-center">Your Morning Board is empty. Tap "+ Board" on any card below to build your sequence.</p>`
                : `<div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-3">
                    ${activeBoardCards
                      .map(
                        (c) => `
                        <div class="p-3.5 rounded-xl lh-elevated flex flex-col justify-between gap-3">
                          <div onclick="window.Lighthouse.openMorningDetail('${c.id}')" class="cursor-pointer space-y-1.5">
                            <div class="flex items-center justify-between gap-2">
                              <span class="text-[10px] font-semibold uppercase tracking-wider" style="color: var(--accent-primary);">${escapeHtml(c.category)}</span>
                              <span class="text-xs font-mono-code lh-text-sec">${escapeHtml(c.defaultTime)} • ${c.durationMins}m</span>
                            </div>
                            <h4 class="font-bold text-sm lh-text-main leading-snug">${escapeHtml(c.title)}</h4>
                            <p class="text-xs lh-text-sec line-clamp-2">${escapeHtml(c.summary)}</p>
                          </div>
                          <div class="flex items-center justify-between pt-2 border-t lh-border">
                            <button onclick="window.Lighthouse.openMorningDetail('${c.id}')" class="text-[11px] font-semibold lh-text-sec hover:lh-text-main flex items-center gap-1">
                              <i data-lucide="book-open" class="w-3 h-3"></i> Science &amp; Scripture
                            </button>
                            <div class="flex items-center gap-1">
                              <button onclick="window.Lighthouse.pushCardToWatch('${c.id}', 'morning')" class="px-2 py-1 rounded-lg lh-btn-soft text-[11px]">+ 24h</button>
                              <button onclick="window.Lighthouse.toggleMorningBoard('${c.id}')" class="p-1 rounded-lg lh-text-muted hover:lh-text-main" title="Remove from Board">
                                <i data-lucide="x" class="w-3.5 h-3.5"></i>
                              </button>
                            </div>
                          </div>
                        </div>
                      `
                      )
                      .join('')}
                  </div>`
            }
          </div>

          <!-- CATEGORY FILTER PILLS -->
          <div class="space-y-3">
            <div class="flex items-center justify-between">
              <h4 class="text-sm font-bold lh-text-main">Morning &amp; Menuha Rest Library (${filteredLibrary.length} Cards)</h4>
              <span class="text-xs lh-text-sec">Tap any card for deep-dive modal</span>
            </div>
            <div class="flex items-center gap-1.5 overflow-x-auto no-scrollbar pb-1">
              ${categories
                .map(
                  (cat) => `
                  <button onclick="window.Lighthouse.setMorningCategory('${cat}')"
                    class="px-3 py-1.5 rounded-xl text-xs font-semibold shrink-0 transition ${
                      state.morningCategoryFilter === cat ? 'lh-btn-primary' : 'lh-surface lh-text-sec'
                    }">
                    ${escapeHtml(cat)}
                  </button>
                `
                )
                .join('')}
            </div>

            <!-- CLEAN PROGRESSIVE-DISCLOSURE CARD GRID -->
            <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-3.5">
              ${filteredLibrary
                .map((c) => {
                  const onBoard = (state.morningBoardIds || []).includes(c.id);
                  return `
                    <div class="lh-surface rounded-2xl p-4 flex flex-col justify-between gap-3 transition hover:border-opacity-80">
                      <div onclick="window.Lighthouse.openMorningDetail('${c.id}')" class="cursor-pointer space-y-2">
                        <div class="flex items-center justify-between gap-2">
                          <span class="text-[10px] font-semibold px-2 py-0.5 rounded-full lh-badge truncate">${escapeHtml(c.category)}</span>
                          <span class="text-xs font-mono-code lh-text-sec shrink-0">${c.durationMins}m</span>
                        </div>
                        <h4 class="font-bold text-sm sm:text-base lh-text-main leading-snug">${escapeHtml(c.title)}</h4>
                        <p class="text-xs lh-text-sec leading-relaxed">${escapeHtml(c.summary)}</p>
                      </div>

                      <div class="pt-2.5 border-t lh-border flex items-center justify-between gap-2">
                        <button onclick="window.Lighthouse.openMorningDetail('${c.id}')"
                          class="text-xs font-semibold lh-text-sec hover:lh-text-main flex items-center gap-1">
                          <i data-lucide="info" class="w-3.5 h-3.5" style="color: var(--accent-primary);"></i>
                          <span>Details</span>
                        </button>
                        <div class="flex items-center gap-1.5">
                          <button onclick="window.Lighthouse.toggleMorningBoard('${c.id}')"
                            class="px-2.5 py-1 rounded-lg text-xs font-semibold ${onBoard ? 'lh-badge-success' : 'lh-elevated lh-text-main'}">
                            ${onBoard ? '✓ On Board' : '+ Board'}
                          </button>
                          <button onclick="window.Lighthouse.pushCardToWatch('${c.id}', 'morning')"
                            class="px-2.5 py-1 rounded-lg lh-btn-primary text-xs">
                            + 24h
                          </button>
                        </div>
                      </div>
                    </div>
                  `;
                })
                .join('')}
            </div>
          </div>
        </div>
      `;
    }

    // =========================================================================
    // STATION 5: NIGHT WATCH & BESPOKE CAPTAIN'S LOG STUDIO
    // =========================================================================
    function renderNightView() {
      const stages = [
        'All',
        'Stage 1: Sunset Transition (90–60m Out)',
        'Stage 2: Somatic Downshift (60–30m Out)',
        'Stage 3: Final Harbor (30–0m to Sleep)'
      ];

      const activeNightBoard = (state.nightBoardIds || [])
        .map((id) => NIGHT_LIBRARY.find((c) => c.id === id))
        .filter(Boolean);

      const filteredNight =
        state.nightStageFilter === 'All'
          ? NIGHT_LIBRARY
          : NIGHT_LIBRARY.filter((c) => c.stage === state.nightStageFilter);

      return `
        <div class="space-y-6">
          <!-- ANALOG BEDSIDE BINDER BANNER -->
          <div class="lh-surface rounded-2xl p-4 sm:p-5 flex flex-wrap items-center justify-between gap-3 border-l-4" style="border-left-color: var(--accent-primary);">
            <div class="space-y-0.5">
              <div class="flex items-center gap-2">
                <span class="text-[10px] font-bold uppercase tracking-wider px-2 py-0.5 rounded-full lh-badge">Zero-Screen Wind-Down</span>
                <span class="text-xs lh-text-sec font-mono-code">3-Hole Binder Ready (8.5" × 11")</span>
              </div>
              <h3 class="font-bold text-base sm:text-lg lh-text-main">Print Tonight’s Analog Night Watch, Prayer &amp; Captain’s Log Sheet</h3>
              <p class="text-xs lh-text-sec">Generate a customized 1–2 page paper worksheet with your evening checklist, prayer board, and ruled journaling lines so you can shut off all screens before bed.</p>
            </div>
            <button onclick="window.Lighthouse.openPdfBuilder()"
              class="px-4 py-2.5 rounded-xl lh-btn-primary text-xs sm:text-sm flex items-center gap-2 shrink-0 shadow-md">
              <i data-lucide="printer" class="w-4 h-4"></i>
              <span>Build Printable Night &amp; Binder Sheet</span>
            </button>
          </div>

          <!-- ACTIVE NIGHT WATCH BOARD -->
          <div class="lh-surface rounded-2xl p-4 sm:p-6 space-y-4">
            <div class="flex flex-wrap items-center justify-between gap-3 pb-3 border-b lh-border">
              <div>
                <span class="text-[11px] font-semibold uppercase tracking-wider px-2.5 py-0.5 rounded-full lh-badge-sec">Active Evening Sequence</span>
                <h3 class="text-lg sm:text-xl font-bold lh-text-main mt-1">My Night Watch Wind-Down Board (${activeNightBoard.length} Cards)</h3>
                <p class="text-xs lh-text-sec">Ordered from Sunset Transition (90m out) to Final Harbor (pillow).</p>
              </div>
              <div class="flex flex-wrap items-center gap-2">
                <button onclick="window.Lighthouse.openPdfBuilder()"
                  class="px-3 py-2 rounded-xl lh-btn-soft text-xs flex items-center gap-1.5">
                  <i data-lucide="file-text" class="w-3.5 h-3.5"></i>
                  <span>Customize PDF Sheet</span>
                </button>
                <button onclick="window.Lighthouse.pushAllNightBoardToWatch()"
                  class="px-3.5 py-2 rounded-xl lh-btn-primary text-xs flex items-center gap-1.5">
                  <i data-lucide="calendar-plus" class="w-3.5 h-3.5"></i>
                  <span>Push Evening Board to 24h Watch</span>
                </button>
              </div>
            </div>

            <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-3">
              ${activeNightBoard
                .map(
                  (c) => `
                  <div class="p-3.5 rounded-xl lh-elevated flex flex-col justify-between gap-2.5">
                    <div onclick="window.Lighthouse.openNightDetail('${c.id}')" class="cursor-pointer space-y-1">
                      <div class="flex items-center justify-between text-[10px] font-semibold lh-text-sec">
                        <span class="truncate" style="color: var(--secondary-accent);">${escapeHtml(c.stage.split(':')[0])}</span>
                        <span class="font-mono-code">${escapeHtml(c.defaultTime)} • ${c.durationMins}m</span>
                      </div>
                      <h4 class="font-bold text-sm lh-text-main">${escapeHtml(c.title)}</h4>
                      <p class="text-xs lh-text-sec line-clamp-2">${escapeHtml(c.summary)}</p>
                    </div>
                    <div class="flex items-center justify-between pt-2 border-t lh-border">
                      <button onclick="window.Lighthouse.openNightDetail('${c.id}')" class="text-[11px] font-semibold lh-text-sec hover:lh-text-main">Details</button>
                      <div class="flex items-center gap-1">
                        <button onclick="window.Lighthouse.pushCardToWatch('${c.id}', 'night')" class="px-2 py-1 rounded-lg lh-btn-soft text-[11px]">+ 24h</button>
                        <button onclick="window.Lighthouse.toggleNightBoard('${c.id}')" class="p-1 lh-text-muted hover:lh-text-main"><i data-lucide="x" class="w-3.5 h-3.5"></i></button>
                      </div>
                    </div>
                  </div>
                `
                )
                .join('')}
            </div>
          </div>

          <!-- STAGE-CATEGORIZED NIGHT WATCH LIBRARY (18 CARDS) -->
          <div class="space-y-3">
            <div class="flex items-center justify-between">
              <h4 class="text-sm font-bold lh-text-main">Night Watch Options by Evening Stage (${filteredNight.length} Cards)</h4>
              <span class="text-xs lh-text-sec">Tap any card for full protocol</span>
            </div>
            <div class="flex items-center gap-1.5 overflow-x-auto no-scrollbar pb-1">
              ${stages
                .map(
                  (st) => `
                  <button onclick="window.Lighthouse.setNightStage('${st}')"
                    class="px-3 py-1.5 rounded-xl text-xs font-semibold shrink-0 transition ${
                      state.nightStageFilter === st ? 'lh-btn-primary' : 'lh-surface lh-text-sec'
                    }">
                    ${escapeHtml(st)}
                  </button>
                `
                )
                .join('')}
            </div>

            <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-3.5">
              ${filteredNight
                .map((c) => {
                  const onBoard = (state.nightBoardIds || []).includes(c.id);
                  const onPrint = (state.pdfConfig?.selectedNightCardIds || []).includes(c.id);
                  return `
                    <div class="lh-surface rounded-2xl p-4 flex flex-col justify-between gap-3">
                      <div onclick="window.Lighthouse.openNightDetail('${c.id}')" class="cursor-pointer space-y-2">
                        <div class="flex items-center justify-between gap-2">
                          <span class="text-[10px] font-semibold px-2 py-0.5 rounded-full lh-badge-sec truncate">${escapeHtml(c.stage)}</span>
                          <span class="text-xs font-mono-code lh-text-sec shrink-0">${c.durationMins}m</span>
                        </div>
                        <h4 class="font-bold text-sm sm:text-base lh-text-main">${escapeHtml(c.title)}</h4>
                        <p class="text-xs lh-text-sec leading-relaxed">${escapeHtml(c.summary)}</p>
                      </div>
                      <div class="pt-2.5 border-t lh-border flex items-center justify-between gap-1">
                        <button onclick="window.Lighthouse.togglePdfNightCard('${c.id}', true)"
                          class="text-[11px] font-semibold px-2 py-1 rounded-lg ${onPrint ? 'lh-badge-success' : 'lh-elevated lh-text-sec'} flex items-center gap-1"
                          title="Include on Printable Binder Sheet">
                          <i data-lucide="printer" class="w-3 h-3"></i>
                          <span>${onPrint ? 'In PDF' : '+ PDF'}</span>
                        </button>
                        <div class="flex items-center gap-1">
                          <button onclick="window.Lighthouse.toggleNightBoard('${c.id}')"
                            class="px-2 py-1 rounded-lg text-xs font-semibold ${onBoard ? 'lh-badge-success' : 'lh-elevated lh-text-main'}">
                            ${onBoard ? '✓ Board' : '+ Board'}
                          </button>
                          <button onclick="window.Lighthouse.pushCardToWatch('${c.id}', 'night')" class="px-2 py-1 rounded-lg lh-btn-primary text-xs">+ 24h</button>
                        </div>
                      </div>
                    </div>
                  `;
                })
                .join('')}
            </div>
          </div>

          <!-- BESPOKE CAPTAIN'S LOG STUDIO -->
          <div class="lh-surface rounded-2xl p-4 sm:p-6 space-y-5">
            <div class="border-b lh-border pb-3 flex flex-wrap items-center justify-between gap-3">
              <div>
                <span class="text-[11px] font-semibold uppercase tracking-wider" style="color: var(--accent-primary);">Captain’s Log — Evening Reflection Studio</span>
                <h3 class="text-lg sm:text-xl font-bold lh-text-main mt-0.5">Choose Tonight’s Bespoke Journaling Architecture</h3>
                <p class="text-xs lh-text-sec">Complete on screen or print a blank 3-hole punched worksheet with ruled writing lines for your bedside binder.</p>
              </div>
              <button onclick="window.Lighthouse.openPdfBuilder()"
                class="px-3.5 py-2 rounded-xl lh-btn-soft text-xs flex items-center gap-1.5 shrink-0">
                <i data-lucide="printer" class="w-3.5 h-3.5"></i>
                <span>Print Blank Worksheet for Bedside Binder</span>
              </button>
            </div>

            <!-- 6 MODE SELECTOR PILLS -->
            <div class="grid grid-cols-2 sm:grid-cols-3 gap-2">
              ${[
                { id: 'baylor_offload', title: '1. Baylor 5-Min Task Offload', sub: 'Checklist + Push to Tomorrow' },
                { id: 'examen', title: '2. 5-Step Biblical Examen', sub: 'All 5 Ignatian/Biblical Movements' },
                { id: 'pennebaker', title: '3. Pennebaker Unpacking', sub: 'Affect Labeling + Reframe' },
                { id: 'narrative', title: '4. Story-Based Gratitude', sub: 'Scene + Vivid Narrative' },
                { id: 'closure_321', title: '5. 3-2-1 Evening Closure', sub: '3 Wins • 2 Lessons • 1 Target' },
                { id: 'psalm4', title: '6. Psalm 4:8 Night Surrender', sub: 'Release Control & Rest' }
              ]
                .map((m) => {
                  const inPdf = (state.pdfConfig?.selectedJournalModes || []).includes(m.id);
                  return `
                    <div class="p-3 rounded-xl transition flex flex-col justify-between gap-2 ${
                      state.selectedJournalMode === m.id ? 'lh-btn-soft' : 'lh-elevated lh-text-main'
                    }">
                      <div onclick="window.Lighthouse.setJournalMode('${m.id}')" class="cursor-pointer">
                        <p class="text-xs font-bold">${escapeHtml(m.title)}</p>
                        <p class="text-[10px] lh-text-sec mt-0.5">${escapeHtml(m.sub)}</p>
                      </div>
                      <div class="flex items-center justify-between pt-1.5 border-t lh-border">
                        <button onclick="window.Lighthouse.setJournalMode('${m.id}')" class="text-[10px] font-semibold lh-text-sec hover:lh-text-main">Open Studio</button>
                        <button onclick="window.Lighthouse.togglePdfJournalMode('${m.id}', true)"
                          class="text-[10px] font-semibold px-2 py-0.5 rounded-md ${inPdf ? 'lh-badge-success' : 'lh-surface lh-text-sec'}">
                          ${inPdf ? '✓ In Print Sheet' : '+ Add to Print Sheet'}
                        </button>
                      </div>
                    </div>
                  `;
                })
                .join('')}
            </div>

            <!-- BESPOKE INTERFACE PER JOURNAL MODE -->
            <div class="p-4 sm:p-5 rounded-2xl lh-elevated space-y-4">
              ${renderBespokeJournalForm()}
            </div>

            <!-- SAVED CAPTAIN'S LOG ENTRIES -->
            ${
              (state.journalEntries || []).length > 0
                ? `<div class="pt-4 border-t lh-border space-y-2.5">
                    <h4 class="text-xs font-bold uppercase tracking-wider lh-text-sec">Saved Captain’s Logs (${state.journalEntries.length})</h4>
                    <div class="space-y-2 max-h-64 overflow-y-auto">
                      ${state.journalEntries
                        .map(
                          (entry) => `
                          <div class="p-3.5 rounded-xl lh-elevated text-xs space-y-1">
                            <div class="flex items-center justify-between lh-text-sec">
                              <span class="font-bold" style="color: var(--accent-primary);">${escapeHtml(entry.framework)}</span>
                              <span class="font-mono-code">${escapeHtml(entry.date)}</span>
                            </div>
                            <p class="lh-text-main whitespace-pre-line leading-relaxed">${escapeHtml(entry.summaryText)}</p>
                          </div>
                        `
                        )
                        .join('')}
                    </div>
                  </div>`
                : ''
            }
          </div>
        </div>
      `;
    }

    function renderBespokeJournalForm() {
      const mode = state.selectedJournalMode;

      if (mode === 'baylor_offload') {
        const tasks = state.baylorTasksDraft || ['', '', ''];
        return `
          <div class="space-y-3">
            <div class="flex items-center justify-between flex-wrap gap-2">
              <h4 class="font-bold text-sm sm:text-base lh-text-main">Baylor Sleep Lab 5-Minute Cognitive Offload</h4>
              <span class="text-[11px] px-2.5 py-0.5 rounded-full lh-badge">Closes Zeigarnik Working-Memory Loops</span>
            </div>
            <p class="text-xs lh-text-sec">
              Polysomnography studies show writing concrete tasks for tomorrow (rather than venting about today) quiets hippocampal rehearsal so you fall asleep significantly faster.
            </p>
            <div class="space-y-2">
              ${tasks
                .map(
                  (t, idx) => `
                  <div class="flex items-center gap-2">
                    <span class="w-6 h-6 rounded-lg lh-surface text-xs font-mono-code flex items-center justify-center shrink-0">${idx + 1}</span>
                    <input type="text" value="${escapeHtml(t)}"
                      oninput="window.Lighthouse.updateBaylorTask(${idx}, this.value)"
                      placeholder="${idx === 0 ? 'Top #1 priority task for tomorrow...' : 'Another open loop or errand to offload...'}"
                      class="flex-1 px-3 py-2 rounded-xl lh-input" />
                    <button onclick="window.Lighthouse.pushBaylorTaskToWatch(${idx})"
                      class="px-2.5 py-2 rounded-xl lh-btn-soft text-xs shrink-0" title="Push to Tomorrow's 24h Watch">
                      + Tomorrow 24h
                    </button>
                  </div>
                `
                )
                .join('')}
            </div>
            <div class="flex flex-wrap gap-2 pt-2">
              <button onclick="window.Lighthouse.addBaylorTaskRow()" class="px-3 py-2 rounded-xl lh-surface text-xs font-semibold lh-text-sec hover:lh-text-main">
                + Add Another Open Loop
              </button>
              <button onclick="window.Lighthouse.saveBaylorLog()" class="px-4 py-2 rounded-xl lh-btn-primary text-xs">
                Save Offload &amp; Close Loops for Tonight
              </button>
            </div>
          </div>
        `;
      }

      if (mode === 'examen') {

                              + Pin Board
                            </button>
                          </div>
                        </div>
                      </div>
                    `;
                  }).join('')}
                </div>
              `
              : ''
          }

          ${
            sub === 'guided'
              ? `
                <div class="lh-surface rounded-2xl p-5 sm:p-6 space-y-5">
                  <div class="flex items-center justify-between flex-wrap gap-2 border-b lh-border pb-3">
                    <div>
                      <span class="text-[11px] font-semibold uppercase tracking-wider" style="color: var(--accent-primary);">Lectio 365 Guided Method</span>
                      <h4 class="text-lg font-bold lh-text-main">Step ${(state.guidedStepIndex || 0) + 1} of 4: ${escapeHtml(curStep.title)}</h4>
                    </div>
                  </div>
                  <div class="p-4 rounded-xl lh-elevated space-y-2">
                    <p class="font-serif-editorial italic text-base sm:text-lg lh-text-main">${escapeHtml(curStep.verse)}</p>
                    <p class="text-xs sm:text-sm lh-text-sec leading-relaxed">${escapeHtml(curStep.prompt)}</p>
                  </div>
                  <div class="flex items-center justify-between pt-2">
                    <button onclick="window.Lighthouse.stepGuidedPrayer(-1)" class="px-4 py-2 rounded-xl lh-elevated text-xs font-semibold lh-text-sec">
                      ← Previous Step
                    </button>
                    <button onclick="window.Lighthouse.stepGuidedPrayer(1)" class="px-5 py-2.5 rounded-xl lh-btn-primary text-xs">
                      ${(state.guidedStepIndex || 0) === 3 ? 'Amen • Complete Sanctuary' : 'Next Movement →'}
                    </button>
                  </div>
                </div>
              `
              : ''
          }

          ${
            sub === 'ebenezer'
              ? `
                <div class="lh-surface rounded-2xl p-4 sm:p-5 space-y-3">
                  <h4 class="font-bold text-base lh-text-main">Ebenezer Vault — “Thus Far the Lord Has Helped Us” (1 Samuel 7:12)</h4>
                  ${
                    answeredCards.length === 0
                      ? `<p class="text-xs lh-text-sec py-4">When God answers a prayer on your board, tap "Answered" to record it permanently in this memorial vault.</p>`
                      : `<div class="grid grid-cols-1 sm:grid-cols-2 gap-3">
                          ${answeredCards
                            .map(
                              (c) => `
                              <div class="p-3.5 rounded-xl lh-elevated space-y-1">
                                <span class="text-[10px] font-semibold px-2 py-0.5 rounded-full lh-badge-success">Answered • ${c.prayedCount || 1} Prayers Logged</span>
                                <h5 class="font-bold text-sm lh-text-main pt-1">${escapeHtml(c.title)}</h5>
                                <p class="text-xs lh-text-sec">${escapeHtml(c.notes || '')}</p>
                              </div>
                            `
                            )
                            .join('')}
                        </div>`
                  }
                </div>
              `
              : ''
          }
        </div>
      `;
    }

    // =========================================================================
    // PAGE-SPECIFIC ACTIONS (MORNING, NIGHT, CAPTAIN'S LOG, PRAYER)
    // =========================================================================
    const pageActions = {
      // Progressive Disclosure Detail Modals
      openMorningDetail(cardId) {
        const c = MORNING_LIBRARY.find((item) => item.id === cardId);
        if (!c) return;
        const onBoard = (state.morningBoardIds || []).includes(c.id);
        openDetailModal({
          category: c.category,
          title: c.title,
          meta: `${c.defaultTime} • ${c.durationMins} mins • ${c.neuroPrinciple}`,
          bodyHtml: `
            <div class="p-3.5 rounded-xl lh-elevated space-y-1">
              <span class="text-[11px] font-bold uppercase tracking-wider" style="color: var(--accent-primary);">Why It Works (Neuroscience &amp; Physiology)</span>
              <p class="text-xs sm:text-sm lh-text-main leading-relaxed">${escapeHtml(c.scienceDetail)}</p>
            </div>
            <div class="p-3.5 rounded-xl lh-elevated space-y-1">
              <span class="text-[11px] font-bold uppercase tracking-wider" style="color: var(--secondary-accent);">Biblical Wisdom (${escapeHtml(c.scriptureRef)})</span>
              <p class="text-xs sm:text-sm lh-text-main leading-relaxed">${escapeHtml(c.scriptureDetail)}</p>
            </div>
            <div class="p-3.5 rounded-xl lh-surface space-y-1">
              <span class="text-[11px] font-bold uppercase tracking-wider" style="color: var(--success-accent);">Action Protocol</span>
              <p class="text-xs sm:text-sm lh-text-main leading-relaxed">${escapeHtml(c.actionSteps)}</p>
            </div>
          `,
          actionsHtml: `
            <button onclick="window.Lighthouse.toggleMorningBoard('${c.id}'); window.Lighthouse.closeDetailModal();"
              class="flex-1 py-2.5 px-4 rounded-xl lh-btn-soft text-xs">
              ${onBoard ? 'Remove from My Morning Board' : '+ Add to My Morning Board'}
            </button>
            <button onclick="window.Lighthouse.pushCardToWatch('${c.id}', 'morning'); window.Lighthouse.closeDetailModal();"
              class="flex-1 py-2.5 px-4 rounded-xl lh-btn-primary text-xs">
              + Push to Today’s 24h Watch (${escapeHtml(c.defaultTime)})
            </button>
          `
        });
      },

      openNightDetail(cardId) {
        const c = NIGHT_LIBRARY.find((item) => item.id === cardId);
        if (!c) return;
        const onBoard = (state.nightBoardIds || []).includes(c.id);
        openDetailModal({
          category: c.stage,
          title: c.title,
          meta: `${c.defaultTime} • ${c.durationMins} mins • ${c.neuroPrinciple}`,
          bodyHtml: `
            <div class="p-3.5 rounded-xl lh-elevated space-y-1">
              <span class="text-[11px] font-bold uppercase tracking-wider" style="color: var(--accent-primary);">Sleep Neuroscience</span>
              <p class="text-xs sm:text-sm lh-text-main leading-relaxed">${escapeHtml(c.scienceDetail)}</p>
            </div>
            <div class="p-3.5 rounded-xl lh-elevated space-y-1">
              <span class="text-[11px] font-bold uppercase tracking-wider" style="color: var(--secondary-accent);">Scripture Anchor (${escapeHtml(c.scriptureRef)})</span>
              <p class="text-xs sm:text-sm lh-text-main leading-relaxed">${escapeHtml(c.scriptureDetail)}</p>
            </div>
            <div class="p-3.5 rounded-xl lh-surface space-y-1">
              <span class="text-[11px] font-bold uppercase tracking-wider" style="color: var(--success-accent);">Evening Action Step</span>
              <p class="text-xs sm:text-sm lh-text-main leading-relaxed">${escapeHtml(c.actionSteps)}</p>
            </div>
          `,
          actionsHtml: `
            <button onclick="window.Lighthouse.toggleNightBoard('${c.id}'); window.Lighthouse.closeDetailModal();"
              class="flex-1 py-2.5 px-4 rounded-xl lh-btn-soft text-xs">
              ${onBoard ? 'Remove from Night Board' : '+ Add to Night Board'}
            </button>
            <button onclick="window.Lighthouse.togglePdfNightCard('${c.id}', true); window.Lighthouse.closeDetailModal();"
              class="py-2.5 px-4 rounded-xl lh-elevated lh-text-main text-xs font-semibold">
              + Add to Printable PDF
            </button>
            <button onclick="window.Lighthouse.pushCardToWatch('${c.id}', 'night'); window.Lighthouse.closeDetailModal();"
              class="flex-1 py-2.5 px-4 rounded-xl lh-btn-primary text-xs">
              + Push to Tonight’s 24h Watch (${escapeHtml(c.defaultTime)})
            </button>
          `
        });
      },

      openPrayerCardDetail(cardId) {
        const c = (state.prayerCards || []).find((item) => item.id === cardId);
        if (!c) return;
        openDetailModal({
          category: c.category,
          title: c.title,
          meta: `Prayed ${c.prayedCount} times • Last: ${c.lastPrayed} • ${c.scriptureTag || ''}`,
          bodyHtml: `
            <div class="p-4 rounded-xl lh-elevated space-y-2">
              <span class="text-[11px] font-bold uppercase tracking-wider" style="color: var(--accent-primary);">Intercession Focus &amp; Notes</span>
              <p class="text-sm lh-text-main leading-relaxed">${escapeHtml(c.notes)}</p>
            </div>
          `,
          actionsHtml: `
            <button onclick="window.Lighthouse.prayForCard('${c.id}'); window.Lighthouse.closeDetailModal();"
              class="flex-1 py-2.5 px-4 rounded-xl lh-btn-primary text-xs">
              Amen • Log Prayer Today
            </button>
            <button onclick="window.Lighthouse.markPrayerAnswered('${c.id}'); window.Lighthouse.closeDetailModal();"
              class="py-2.5 px-4 rounded-xl lh-btn-soft text-xs">
              Mark Answered (Ebenezer)
            </button>
          `
        });
      },

      openJesusTeachingDetail(themeId) {
        const item = JESUS_PRAYER_THEMES.find((t) => t.id === themeId);
        if (!item) return;
        openDetailModal({
          category: `${item.category} • ${item.reference}`,
          title: item.theme,
          meta: 'What Jesus Taught Us to Pray For (NASB & NLT Study)',
          bodyHtml: `
            <div class="p-3.5 rounded-xl lh-elevated space-y-1">
              <span class="text-[11px] font-bold uppercase tracking-wider" style="color: var(--accent-primary);">NASB Structural Study Lens</span>
              <p class="text-xs sm:text-sm lh-text-main leading-relaxed">${escapeHtml(item.nasbLens)}</p>
            </div>
            <div class="p-3.5 rounded-xl lh-elevated space-y-1">
              <span class="text-[11px] font-bold uppercase tracking-wider" style="color: var(--secondary-accent);">NLT Relational Heart Lens</span>
              <p class="text-xs sm:text-sm lh-text-main leading-relaxed">${escapeHtml(item.nltLens)}</p>
            </div>
            <div class="p-3.5 rounded-xl lh-surface space-y-1">
              <span class="text-[11px] font-bold uppercase tracking-wider" style="color: var(--success-accent);">Sample Prayer Prompt</span>
              <p class="font-serif-editorial italic text-base lh-text-main">“${escapeHtml(item.samplePrayer)}”</p>
            </div>
          `,
          actionsHtml: `
            <button onclick="window.Lighthouse.addJesusThemeToBoard('${item.id}'); window.Lighthouse.closeDetailModal();"
              class="w-full py-2.5 px-4 rounded-xl lh-btn-primary text-xs">
              + Pin This Teaching to My Active Prayer Board
            </button>
          `
        });
      },

      // Morning & Night Board Handlers
      setMorningCategory(cat) {
        state.morningCategoryFilter = cat;
        renderApp();
      },
      toggleMorningBoard(cardId) {
        const exists = (state.morningBoardIds || []).includes(cardId);
        state.morningBoardIds = exists
          ? state.morningBoardIds.filter((id) => id !== cardId)
          : [...(state.morningBoardIds || []), cardId];
        saveState();
        renderApp();
        showToast(exists ? 'Removed from Morning Board.' : 'Added to My Morning Board!');
      },
      load30MinWorkoutPreset() {
        const rampIds = ['mw-1', 'mw-2', 'mw-3', 'mw-4', 'mw-5'];
        state.morningBoardIds = Array.from(new Set([...rampIds, ...(state.morningBoardIds || [])]));
        saveState();
        renderApp();
        showToast('Loaded all 5 Wake-to-Workout (30m Ramp) cards onto your board!');
      },
      pushCardToWatch(cardId, type) {
        if (state.planLocked) return showToast('Unlock 24h Watchtower first.');
        const lib = type === 'morning' ? MORNING_LIBRARY : NIGHT_LIBRARY;
        const c = lib.find((i) => i.id === cardId);
        if (!c) return;
        state.planBlocks.push({
          id: `pb-${Date.now()}-${Math.random().toString(36).slice(2, 5)}`,
          title: c.title,
          startTime: c.defaultTime || '06:00',
          durationMins: c.durationMins || 10,
          category: type,
          completed: false,
          dayOffset: 0
        });
        saveState();
        showToast(`Pushed "${c.title}" to 24h Watchtower!`);
      },
      pushAllMorningBoardToWatch() {
        if (state.planLocked) return showToast('Unlock 24h Watchtower first.');
        const cards = (state.morningBoardIds || []).map((id) => MORNING_LIBRARY.find((c) => c.id === id)).filter(Boolean);
        cards.forEach((c) => {
          state.planBlocks.push({
            id: `pb-${Date.now()}-${Math.random().toString(36).slice(2, 6)}`,
            title: c.title,
            startTime: c.defaultTime,
            durationMins: c.durationMins,
            category: 'morning',
            completed: false,
            dayOffset: 0
          });
        });
        saveState();
        showToast(`Pushed ${cards.length} Morning Board cards to today’s 24h Watchtower!`);
      },
      setNightStage(st) {
        state.nightStageFilter = st;
        renderApp();
      },
      toggleNightBoard(cardId) {
        const exists = (state.nightBoardIds || []).includes(cardId);
        state.nightBoardIds = exists
          ? state.nightBoardIds.filter((id) => id !== cardId)
          : [...(state.nightBoardIds || []), cardId];
        saveState();
        renderApp();
        showToast(exists ? 'Removed from Night Board.' : 'Added to Night Watch Board!');
      },
      pushAllNightBoardToWatch() {
        if (state.planLocked) return showToast('Unlock 24h Watchtower first.');
        const cards = (state.nightBoardIds || []).map((id) => NIGHT_LIBRARY.find((c) => c.id === id)).filter(Boolean);
        cards.forEach((c) => {
          state.planBlocks.push({
            id: `pb-${Date.now()}-${Math.random().toString(36).slice(2, 6)}`,
            title: c.title,
            startTime: c.defaultTime,
            durationMins: c.durationMins,
            category: 'night',
            completed: false,
            dayOffset: 0
          });
        });
        saveState();
        showToast(`Pushed ${cards.length} Night Watch cards to tonight’s 24h Watchtower!`);
      },

      // Bespoke Captain's Log Handlers
      setJournalMode(modeId) {
        state.selectedJournalMode = modeId;
        renderApp();
      },
      updateBaylorTask(idx, val) {
        state.baylorTasksDraft[idx] = val;
      },
      addBaylorTaskRow() {
        state.baylorTasksDraft.push('');
        renderApp();
      },
      pushBaylorTaskToWatch(idx) {
        const txt = (state.baylorTasksDraft[idx] || '').trim();
        if (!txt) return showToast('Write a task in that row first.');
        state.planBlocks.push({
          id: `pb-${Date.now()}`,
          title: `[Offload #${idx + 1}] ${txt}`,
          startTime: idx === 0 ? '08:30' : '10:00',
          durationMins: 30,
          category: 'morning',
          completed: false,
          dayOffset: 1
        });
        saveState();
        showToast(`Pushed "${txt}" to Tomorrow’s 24h Watchtower!`);
      },
      saveBaylorLog() {
        const clean = (state.baylorTasksDraft || []).map((t) => t.trim()).filter(Boolean);
        if (clean.length === 0) return;
        state.journalEntries.unshift({
          id: `je-${Date.now()}`,
          date: new Date().toLocaleString(),
          framework: 'Baylor 5-Min Cognitive Offload',
          summaryText: clean.map((t, i) => `${i + 1}. ${t}`).join('\n')
        });
        state.baylorTasksDraft = ['', '', ''];
        ensureDailyLog(getLocalIsoDate(0)).nightDone = true;
        saveState();
        renderApp();
        showToast('Saved Baylor Cognitive Offload & marked Night Watch complete!');
      },
      updateExamenStep(key, val) {
        state.examenDraft[key] = val;
      },
      saveExamenLog() {
        const d = state.examenDraft;
        const text = [
          d.s1 && `1. Gratitude: ${d.s1}`,
          d.s2 && `2. Light: ${d.s2}`,
          d.s3 && `3. Review: ${d.s3}`,
          d.s4 && `4. Forgiveness: ${d.s4}`,
          d.s5 && `5. Tomorrow’s Grace: ${d.s5}`
        ]
          .filter(Boolean)
          .join('\n');
        if (!text) return;
        state.journalEntries.unshift({
          id: `je-${Date.now()}`,
          date: new Date().toLocaleString(),
          framework: '5-Step Biblical Examen',
          summaryText: text
        });
        state.examenDraft = { s1: '', s2: '', s3: '', s4: '', s5: '' };
        ensureDailyLog(getLocalIsoDate(0)).nightDone = true;
        saveState();
        renderApp();
        showToast('Saved 5-Step Biblical Examen & marked Night Watch complete!');
      },
      updatePennebaker(key, val) {
        state.pennebakerDraft[key] = val;
        if (key === 'intensity') renderApp();
      },
      savePennebakerLog() {
        const d = state.pennebakerDraft;
        if (!d.raw.trim() && !d.reframe.trim()) return;
        state.journalEntries.unshift({
          id: `je-${Date.now()}`,
          date: new Date().toLocaleString(),
          framework: `Pennebaker Unpacking (Tension ${d.intensity}/10)`,
          summaryText: `Unpacked: ${d.raw}\nReframe: ${d.reframe}`
        });
        state.pennebakerDraft = { raw: '', reframe: '', intensity: 5 };
        ensureDailyLog(getLocalIsoDate(0)).nightDone = true;
        saveState();
        renderApp();
        showToast('Saved Pennebaker Unpacking & marked Night Watch complete!');
      },
      updateNarrative(key, val) {
        state.narrativeDraft[key] = val;
      },
      saveNarrativeLog() {
        const d = state.narrativeDraft;
        if (!d.story.trim()) return;
        state.journalEntries.unshift({
          id: `je-${Date.now()}`,
          date: new Date().toLocaleString(),
          framework: 'Story-Based Narrative Gratitude',
          summaryText: `Scene: ${d.scene}\nStory: ${d.story}\nTakeaway: ${d.meaning}`
        });
        state.narrativeDraft = { scene: '', story: '', meaning: '' };
        ensureDailyLog(getLocalIsoDate(0)).nightDone = true;
        saveState();
        renderApp();
        showToast('Saved Gratitude Story & marked Night Watch complete!');
      },
      update321(key, val) {
        state.closure321Draft[key] = val;
      },
      save321Log() {
        const d = state.closure321Draft;
        const text = `Wins: ${[d.w1, d.w2, d.w3].filter(Boolean).join(' • ')}\nLessons: ${[d.l1, d.l2].filter(Boolean).join(' • ')}\nTomorrow’s #1: ${d.p1}`;
        state.journalEntries.unshift({
          id: `je-${Date.now()}`,
          date: new Date().toLocaleString(),
          framework: '3-2-1 Evening Closure',
          summaryText: text
        });
        state.closure321Draft = { w1: '', w2: '', w3: '', l1: '', l2: '', p1: '' };
        ensureDailyLog(getLocalIsoDate(0)).nightDone = true;
        saveState();
        renderApp();
        showToast('Saved 3-2-1 Closure & marked Night Watch complete!');
      },
      updatePsalm4(key, val) {
        state.psalm4Draft[key] = val;
      },
      savePsalm4Log() {
        const d = state.psalm4Draft;
        if (!d.burdens.trim() && !d.prayer.trim()) return;
        state.journalEntries.unshift({
          id: `je-${Date.now()}`,
          date: new Date().toLocaleString(),
          framework: 'Psalm 4:8 Night Watch Surrender',
          summaryText: `Released: ${d.burdens}\nPrayer: ${d.prayer}`
        });
        state.psalm4Draft = { burdens: '', prayer: '' };
        ensureDailyLog(getLocalIsoDate(0)).nightDone = true;
        saveState();
        renderApp();
        showToast('Entrusted tonight’s watch to the Lord & marked Night Watch complete.');
      },

      // Prayer Sanctuary Handlers
      setPrayerSubTab(sub) {
        state.prayerSubTab = sub;
        renderApp();
      },
      handlePrayerCategoryChange(selectId, customInputId) {
        const sel = document.getElementById(selectId);
        const inp = document.getElementById(customInputId);
        if (!sel || !inp) return;
        if (sel.value === 'Custom Category...') {
          inp.classList.remove('hidden');
          inp.focus();
        } else {
          inp.classList.add('hidden');
        }
      },
      resolvePrayerCategoryValue(selectId, customInputId) {
        const selVal = document.getElementById(selectId)?.value || 'Other / General';
        if (selVal === 'Custom Category...') {
          const customVal = (document.getElementById(customInputId)?.value || '').trim();
          return customVal || 'Other / General';
        }
        return selVal;
      },
      quickAddPrayerCard() {
        const titleEl = document.getElementById('quick-pray-title');
        const title = (titleEl?.value || '').trim();
        if (!title) return showToast('Type a prayer request or name first.');
        const category = this.resolvePrayerCategoryValue('quick-pray-cat', 'quick-pray-custom-cat');
        const scriptureTag = (document.getElementById('quick-pray-ref')?.value || '').trim() || 'Philippians 4:6-7';
        const notes = (document.getElementById('quick-pray-notes')?.value || '').trim() || 'Lifted up in prayer watch.';
        const pinToBoard = document.getElementById('quick-pray-pin')?.checked !== false;

        state.prayerCards.unshift({
          id: `pc-${Date.now()}`,
          title,
          category,
          scriptureTag,
          notes,
          prayedCount: 0,
          lastPrayed: 'Added Today',
          onActiveBoard: pinToBoard,
          isAnswered: false
        });
        saveState();
        renderApp();
        showToast(pinToBoard ? `Pinned "${title}" (${category}) to your Prayer Board!` : `Added "${title}" to your Intercession Deck!`);
      },
      prayForCard(cardId) {
        state.prayerCards = state.prayerCards.map((c) =>
          c.id === cardId ? { ...c, prayedCount: (c.prayedCount || 0) + 1, lastPrayed: 'Today' } : c
        );
        ensureDailyLog(getLocalIsoDate(0)).prayerDone = true;
        saveState();
        renderApp();
        showToast('Amen — logged intercession & marked today’s Prayer Watch complete!');
      },
      togglePrayerBoardPin(cardId) {
        state.prayerCards = state.prayerCards.map((c) =>
          c.id === cardId ? { ...c, onActiveBoard: !c.onActiveBoard } : c
        );
        saveState();
        renderApp();
      },
      markPrayerAnswered(cardId) {
        state.prayerCards = state.prayerCards.map((c) =>
          c.id === cardId ? { ...c, isAnswered: true, onActiveBoard: false } : c
        );
        saveState();
        renderApp();
        showToast('Moved to Answered Ebenezer Vault!');
      },
      addJesusThemeToBoard(themeId) {
        const t = JESUS_PRAYER_THEMES.find((i) => i.id === themeId);
        if (!t) return;
        state.prayerCards.unshift({
          id: `pc-${Date.now()}`,
          title: t.theme,
          category: t.category,
          scriptureTag: t.reference,
          notes: t.samplePrayer,
          prayedCount: 0,
          lastPrayed: 'Jesus’s Teaching',
          onActiveBoard: true,
          isAnswered: false
        });
        saveState();
        renderApp();
        showToast(`Pinned "${t.theme}" to your Active Prayer Board!`);
      },
      pushPrayerBlockToWatch() {
        state.planBlocks.push({
          id: `pb-${Date.now()}`,
          title: 'Sanctuary Active Prayer Watch',
          startTime: '07:05',
          durationMins: 15,
          category: 'prayer',
          completed: false,
          dayOffset: 0
        });
        saveState();
        showToast('Scheduled Prayer Watch on 24h Watchtower!');
      },
      stepGuidedPrayer(delta) {
        const next = state.guidedStepIndex + delta;
        if (next >= 4) {
          state.guidedStepIndex = 0;
          showToast('Amen • Completed Guided P.R.A.Y. Sanctuary!');
        } else {
          state.guidedStepIndex = Math.max(0, next);
        }
        renderApp();
      }
    };

    initLighthousePage({
      page: 'sanctuary.html',
      defaultTab: 'morning',
      renderers: {
        morning: renderMorningView,
        night: renderNightView,
        prayer: renderPrayerView
      },
      actions: pageActions
    });
  </script>
</body>
</html>
