  <!-- HARBOR WALL PRO TASK EDITOR & CALENDAR SCHEDULER MODAL -->
  <div id="task-pro-modal" class="fixed inset-0 z-50 bg-black/75 backdrop-blur-sm hidden items-end sm:items-center justify-center p-0 sm:p-4">
    <div class="lh-surface rounded-t-3xl sm:rounded-2xl p-5 sm:p-6 max-w-xl w-full max-h-[92vh] overflow-y-auto space-y-4 shadow-2xl">
      <div class="flex items-start justify-between gap-3 pb-3 border-b lh-border">
        <div>
          <span class="text-[10px] font-bold uppercase tracking-wider px-2.5 py-0.5 rounded-full lh-badge">Harbor Wall Pro • Task &amp; Schedule</span>
          <h3 id="task-modal-heading" class="text-base sm:text-lg font-bold lh-text-main mt-1.5">Edit &amp; Schedule Task</h3>
        </div>
        <button onclick="window.Lighthouse.closeTaskProModal()" class="p-2 rounded-xl lh-elevated lh-text-sec hover:lh-text-main">
          <i data-lucide="x" class="w-4 h-4"></i>
        </button>
      </div>
      <div id="task-pro-modal-body" class="space-y-4"></div>
    </div>
  </div>

  <script type="module">
    import {
      WORKOUT_MODALITIES,
      TASK_PRIORITIES,
      TASK_RECURRENCE_OPTIONS,
      getLocalIsoDate,
      addDaysToIsoDate,
      getNextRecurrenceDate,
      getDayOffsetFromIsoDate,
      formatShortDate,
      formatFullDate
    } from './data.js';
    import {
      state,
      saveState,
      renderApp,
      showToast,
      escapeHtml,
      isEventMuted,
      getEventDayOffset,
      getGcalSessionStatus,
      ensureDailyLog,
      initLighthousePage
    } from './core.js';

    // =========================================================================
    // LOCAL MODULE STATE FOR PRO TASK MODAL & FOCUS TIMER
    // =========================================================================
    let activeTaskModalRef = null; // { boardId, itemId }
    const focusTimer = {
      boardId: null,
      itemId: null,
      title: '',
      totalSec: 1500,
      remainingSec: 1500,
      running: false,
      intervalId: null
    };

    function formatIsoToShortLabel(dateStr) {
      if (!dateStr) return '';
      const [y, m, d] = dateStr.split('-').map(Number);
      if (!y || !m || !d) return dateStr;
      return new Date(y, m - 1, d).toLocaleDateString('en-US', {
        weekday: 'short',
        month: 'short',
        day: 'numeric'
      });
    }

    function formatClockMMSS(sec) {
      const s = Math.max(0, Math.floor(sec));
      const m = Math.floor(s / 60);
      const r = s % 60;
      return `${String(m).padStart(2, '0')}:${String(r).padStart(2, '0')}`;
    }

    function findListItem(boardId, itemId) {
      const board = (state.lists || []).find((b) => b.id === boardId);
      if (!board) return { board: null, item: null };
      const item = (board.items || []).find((it) => it.id === itemId) || null;
      return { board, item };
    }

    // Build a pre-filled Google Calendar event template URL for 1-click export
    function buildGoogleCalendarEventUrl(item, boardTitle = '') {
      const dateStr = item.scheduledDate || item.dueDate || getLocalIsoDate(0);
      const timeStr = item.scheduledTime || '09:00';
      const duration = Math.max(15, Number(item.durationMins) || 30);
      const [y, m, d] = dateStr.split('-').map(Number);
      const [hh, mm] = timeStr.split(':').map(Number);
      const startDt = new Date(y, m - 1, d, hh || 9, mm || 0, 0);
      const endDt = new Date(startDt.getTime() + duration * 60000);
      const fmt = (dt) =>
        `${dt.getFullYear()}${String(dt.getMonth() + 1).padStart(2, '0')}${String(dt.getDate()).padStart(2, '0')}T${String(dt.getHours()).padStart(2, '0')}${String(dt.getMinutes()).padStart(2, '0')}00`;

      const detailsParts = [];
      if (boardTitle) detailsParts.push(`Harbor Wall Board: ${boardTitle}`);
      if (item.notes) detailsParts.push(item.notes);
      if (item.subtasks?.length) {
        detailsParts.push(
          'Checklist:\n' + item.subtasks.map((s) => `${s.completed ? '[x]' : '[ ]'} ${s.text}`).join('\n')
        );
      }

      const params = new URLSearchParams({
        action: 'TEMPLATE',
        text: item.text || 'Lighthouse Task',
        dates: `${fmt(startDt)}/${fmt(endDt)}`,
        details: detailsParts.join('\n\n')
      });
      return `https://calendar.google.com/calendar/render?${params.toString()}`;
    }

    // Natural-Language Quick Task Parser
    // Example: "Call Shannon tomorrow 2:30pm 30m !p1 #errands @Dan"
    function parseNaturalTaskInput(rawInput) {
      let text = String(rawInput || '').trim();
      let priority = 'p3';
      let dueDate = '';
      let scheduledDate = '';
      let scheduledTime = '15:00';
      let durationMins = 30;
      let assignedTo = 'Dan';
      let recurrence = 'none';
      let hasExplicitTime = false;
      const tags = [];

      // Priority: !p1..p4 or p1..p4
      text = text.replace(/(?:^|\s)!?p([1-4])\b/gi, (_, num) => {
        priority = `p${num}`;
        return ' ';
      });

      // Tags: #word
      text = text.replace(/#([a-z0-9_-]+)/gi, (_, tag) => {
        tags.push(tag.toLowerCase());
        return ' ';
      });

      // Assignee: @Name
      text = text.replace(/@([a-z]+)/gi, (_, who) => {
        assignedTo = who.charAt(0).toUpperCase() + who.slice(1).toLowerCase();
        return ' ';
      });

      // Recurrence shortcuts: "every day", "daily", "weekly", "weekdays", "monthly"
      if (/\b(every\s+day|daily)\b/i.test(text)) {
        recurrence = 'daily';
        text = text.replace(/\b(every\s+day|daily)\b/gi, ' ');
      } else if (/\b(weekdays|every\s+weekday)\b/i.test(text)) {
        recurrence = 'weekdays';
        text = text.replace(/\b(weekdays|every\s+weekday)\b/gi, ' ');
      } else if (/\b(every\s+week|weekly)\b/i.test(text)) {
        recurrence = 'weekly';
        text = text.replace(/\b(every\s+week|weekly)\b/gi, ' ');
      } else if (/\b(every\s+month|monthly)\b/i.test(text)) {
        recurrence = 'monthly';
        text = text.replace(/\b(every\s+month|monthly)\b/gi, ' ');
      }

      // Duration: 30m, 45min, 1h, 2hrs
      text = text.replace(/\b(\d+)\s?(mins?|m|hrs?|h)\b/gi, (_, qty, unit) => {
        const n = Number(qty);
        durationMins = unit.toLowerCase().startsWith('h') ? n * 60 : n;
        return ' ';
      });

      // Explicit time: 2pm, 2:30pm, 9am, 14:30
      text = text.replace(/\b(\d{1,2})(?::(\d{2}))?\s?(am|pm)\b/i, (_, hStr, mStr, mer) => {
        let h = Number(hStr);
        const m = Number(mStr || 0);
        if (mer.toLowerCase() === 'pm' && h < 12) h += 12;
        if (mer.toLowerCase() === 'am' && h === 12) h = 0;
        scheduledTime = `${String(h).padStart(2, '0')}:${String(m).padStart(2, '0')}`;
        hasExplicitTime = true;
        return ' ';
      });
      if (!hasExplicitTime) {
        text = text.replace(/\b([01]?\d|2[0-3]):([0-5]\d)\b/, (_, hStr, mStr) => {
          scheduledTime = `${String(Number(hStr)).padStart(2, '0')}:${mStr}`;
          hasExplicitTime = true;
          return ' ';
        });
      }

      // Date keywords: ISO date, today, tomorrow, next weekday
      const isoMatch = text.match(/\b(\d{4}-\d{2}-\d{2})\b/);
      if (isoMatch) {
        dueDate = isoMatch[1];
        text = text.replace(isoMatch[0], ' ');
      } else if (/\btoday\b/i.test(text)) {
        dueDate = getLocalIsoDate(0);
        text = text.replace(/\btoday\b/gi, ' ');
      } else if (/\b(tomorrow|tmrw)\b/i.test(text)) {
        dueDate = getLocalIsoDate(1);
        text = text.replace(/\b(tomorrow|tmrw)\b/gi, ' ');
      } else {
        const dayNames = ['sun', 'mon', 'tue', 'wed', 'thu', 'fri', 'sat'];
        const wdMatch = text.match(/\b(sunday|sun|monday|mon|tuesday|tue|wednesday|wed|thursday|thu|friday|fri|saturday|sat)\b/i);
        if (wdMatch) {
          const targetIdx = dayNames.indexOf(wdMatch[1].slice(0, 3).toLowerCase());
          const todayIdx = new Date().getDay();
          let diff = (targetIdx - todayIdx + 7) % 7;
          if (diff === 0) diff = 7;
          dueDate = getLocalIsoDate(diff);
          text = text.replace(wdMatch[0], ' ');
        }
      }

      if (hasExplicitTime) {
        scheduledDate = dueDate || getLocalIsoDate(0);
        if (!dueDate) dueDate = scheduledDate;
      }

      return {
        text: text.replace(/\s+/g, ' ').trim(),
        priority,
        dueDate,
        scheduledDate,
        scheduledTime,
        durationMins,
        assignedTo,
        recurrence,
        tags: Array.from(new Set(tags)),
        autoSchedule: hasExplicitTime
      };
    }

    // Sync a Harbor Wall list item onto the Watchtower Calendar (creates or updates linked block)
    function upsertWatchBlockForTask(board, item, targetDate, targetTime, durationMins) {
      const dateStr = targetDate || item.scheduledDate || item.dueDate || getLocalIsoDate(0);
      const startTime = targetTime || item.scheduledTime || '15:00';
      const dur = Math.max(5, Number(durationMins || item.durationMins) || 30);
      const dayOffset = getDayOffsetFromIsoDate(dateStr);

      item.scheduledDate = dateStr;
      item.scheduledTime = startTime;
      item.durationMins = dur;
      if (!item.dueDate) item.dueDate = dateStr;

      const existingIdx = (state.planBlocks || []).findIndex(
        (b) =>
          (item.watchBlockId && b.id === item.watchBlockId) ||
          (b.sourceType === 'list' && b.sourceId === item.id)
      );

      const blockPayload = {
        id: existingIdx >= 0 ? state.planBlocks[existingIdx].id : `pb-task-${Date.now()}-${Math.random().toString(36).slice(2, 5)}`,
        title: `[${board.title}] ${item.text}`,
        startTime,
        durationMins: dur,
        category: 'list',
        sourceType: 'list',
        sourceId: item.id,
        sourceBoardId: board.id,
        dateStr,
        dayOffset: dayOffset !== null ? dayOffset : 0,
        completed: Boolean(item.completed)
      };

      if (existingIdx >= 0) {
        state.planBlocks[existingIdx] = blockPayload;
      } else {
        state.planBlocks.push(blockPayload);
      }
      item.watchBlockId = blockPayload.id;
      return blockPayload;
    }

    // =========================================================================
    // STATION 1: WATCHTOWER (24H) — WITH PROMINENT GCAL SYNC & TWO-WAY REMOVAL
    // =========================================================================
    function renderWatchtowerView() {
      const todayIso = getLocalIsoDate(0);
      const selOffset = state.selectedDayOffset;
      const gcalStatus = getGcalSessionStatus();

      const planItems = (state.planBlocks || [])
        .map((b) => {
          const computedOffset = b.dateStr ? getDayOffsetFromIsoDate(b.dateStr) : b.dayOffset;
          return {
            ...b,
            computedOffset,
            streamType: 'plan_block',
            sortDate: b.dateStr || getLocalIsoDate(b.dayOffset || 0),
            sortTime: b.startTime || '08:00'
          };
        })
        .filter((b) => b.computedOffset !== null && b.computedOffset !== undefined)
        .filter((b) => (selOffset === 2 ? b.computedOffset >= 2 : b.computedOffset === selOffset));

      const workoutItems = (state.workouts || [])
        .map((w) => ({ ...w, computedOffset: getDayOffsetFromIsoDate(w.date) }))
        .filter((w) => w.computedOffset !== null)
        .filter((w) => (selOffset === 2 ? w.computedOffset >= 2 : w.computedOffset === selOffset))
        .map((w) => ({
          ...w,
          streamType: 'workout_event',
          sortDate: w.date || todayIso,
          sortTime: w.startTime || '06:00'
        }));

      const allDatedGcalForView = (state.gcalEvents || [])
        .map((ev) => ({ ...ev, computedOffset: getEventDayOffset(ev) }))
        .filter((ev) => ev.computedOffset !== null)
        .filter((ev) => (selOffset === 2 ? ev.computedOffset >= 2 : ev.computedOffset === selOffset));

      const calItems = allDatedGcalForView
        .filter((ev) => state.peekFilteredEvents || !isEventMuted(ev))
        .map((ev) => ({
          ...ev,
          streamType: 'gcal_event',
          isMuted: isEventMuted(ev),
          sortDate: ev.dateStr,
          sortTime: ev.startTime || '08:00'
        }));

      const mutedCount = allDatedGcalForView.length - calItems.length;

      const unified = [...calItems, ...workoutItems, ...planItems].sort(
        (a, b) => (a.sortDate || '').localeCompare(b.sortDate || '') || a.sortTime.localeCompare(b.sortTime)
      );

      const syncLabel = gcalStatus.lastSyncLabel;
      const isLiveSynced = syncLabel.startsWith('Live Sync') || syncLabel.startsWith('.ICS Import');
      const activeHeadingDate =
        selOffset === 0
          ? formatFullDate(0)
          : selOffset === 1
          ? formatFullDate(1)
          : `${formatShortDate(2)} – ${formatShortDate(14)}`;

      const sourceBadgeText = (item) => {
        if (item.sourceType === 'morning') return 'Synced • Morning Board';
        if (item.sourceType === 'night') return 'Synced • Night Board';
        if (item.sourceType === 'prayer') return 'Synced • Prayer Board';
        if (item.sourceType === 'list') return 'Synced • Harbor Wall';
        return '';
      };

      const deleteTooltipText = (item) => {
        if (item.sourceType === 'morning') return 'Remove from Watchtower AND Morning Board';
        if (item.sourceType === 'night') return 'Remove from Watchtower AND Night Watch Board';
        if (item.sourceType === 'prayer') return 'Remove from Watchtower AND unpin from Prayer Board';
        if (item.sourceType === 'list') return 'Unschedule from Watchtower (keeps task in Harbor Wall)';
        return 'Remove from Watchtower';
      };

      return `
        <div class="space-y-5">
          <!-- TOP HORIZON BAR + PROMINENT GOOGLE CALENDAR AUTO-SYNC STRIP -->
          <div class="lh-surface rounded-2xl p-4 sm:p-5 space-y-4">
            <div class="flex flex-wrap items-center justify-between gap-3">
              <div>
                <span class="text-[11px] font-semibold uppercase tracking-wider lh-text-sec">
                  ${escapeHtml(activeHeadingDate)}
                </span>
                <h3 class="text-lg sm:text-xl font-bold lh-text-main mt-0.5">Clear the Fog • Lock Your Next 24 Hours</h3>
              </div>
              <div class="flex items-center gap-2 flex-wrap">
                <button onclick="window.Lighthouse.togglePeekMuted()"
                  class="px-3 py-1.5 rounded-xl lh-elevated text-xs font-medium lh-text-sec hover:lh-text-main flex items-center gap-1.5">
                  <i data-lucide="${state.peekFilteredEvents ? 'eye-off' : 'eye'}" class="w-3.5 h-3.5"></i>
                  <span>${state.peekFilteredEvents ? 'Hide Muted' : `Peek Muted${mutedCount > 0 ? ` (${mutedCount})` : ''}`}</span>
                </button>
                <button onclick="window.Lighthouse.togglePlanLock()"
                  class="px-3.5 py-1.5 rounded-xl text-xs font-semibold flex items-center gap-1.5 ${
                    state.planLocked ? 'lh-btn-primary' : 'lh-btn-soft'
                  }">
                  <i data-lucide="${state.planLocked ? 'lock' : 'unlock'}" class="w-3.5 h-3.5"></i>
                  <span>${state.planLocked ? 'Watch Locked' : 'Lock 24h Watch'}</span>
                </button>
              </div>
            </div>

            <!-- PROMINENT ONE-TAP GOOGLE CALENDAR SYNC BAR -->
            <div class="p-3 rounded-xl lh-elevated flex flex-wrap items-center justify-between gap-3 border-l-4"
              style="border-left-color: ${gcalStatus.hasToken ? 'var(--success-accent)' : 'var(--secondary-accent)'};">
              <div class="flex items-center gap-2.5 min-w-0">
                <div class="p-2 rounded-xl ${gcalStatus.hasToken ? 'lh-badge-success' : 'lh-badge-sec'} shrink-0">
                  <i data-lucide="calendar" class="w-4 h-4"></i>
                </div>
                <div class="min-w-0">
                  <div class="flex items-center gap-2 flex-wrap">
                    <span class="text-xs font-bold lh-text-main">
                      ${
                        gcalStatus.syncing
                          ? 'Syncing Google Calendars...'
                          : gcalStatus.hasToken
                          ? `Google Calendar Auto-Sync Active (${gcalStatus.expiresInMins}m session left)`
                          : 'Google Calendar Sync'
                      }
                    </span>
                    <span class="text-[10px] font-mono-code px-2 py-0.5 rounded-full lh-surface lh-text-sec">
                      ${escapeHtml(syncLabel)}
                    </span>
                  </div>
                  <p class="text-[11px] lh-text-sec truncate">
                    ${
                      gcalStatus.hasToken && gcalStatus.autoEnabled
                        ? `Auto-refreshes every ${gcalStatus.intervalMins} mins & on tab return across all Lighthouse pages.`
                        : 'Tap Sync Now to sign in once and enable automatic background updates for the next hour.'
                    }
                  </p>
                </div>
              </div>
              <div class="flex items-center gap-1.5 shrink-0">
                <button onclick="window.Lighthouse.syncGcalQuick()"
                  class="px-3.5 py-2 rounded-xl lh-btn-primary text-xs font-bold flex items-center gap-1.5 shadow-sm">
                  <i data-lucide="refresh-cw" class="w-3.5 h-3.5 ${gcalStatus.syncing ? 'animate-spin' : ''}"></i>
                  <span>${gcalStatus.syncing ? 'Syncing...' : gcalStatus.hasToken ? 'Refresh Now' : 'Sync Google Calendar'}</span>
                </button>
                <button onclick="window.Lighthouse.openGcalModal()"
                  class="p-2 rounded-xl lh-surface lh-text-sec hover:lh-text-main" title="GCal Auto-Sync Settings & .ICS Import">
                  <i data-lucide="settings-2" class="w-4 h-4"></i>
                </button>
              </div>
            </div>

            <div class="grid grid-cols-3 gap-2">
              ${[
                { offset: 0, label: `Today • ${formatShortDate(0)}` },
                { offset: 1, label: `Tomorrow • ${formatShortDate(1)}` },
                { offset: 2, label: 'Horizon (+2–14d)' }
              ]
                .map(
                  (d) => `
                  <button onclick="window.Lighthouse.setDayOffset(${d.offset})"
                    class="py-2.5 px-2 sm:px-3 rounded-xl text-[11px] sm:text-xs font-semibold transition truncate ${
                      selOffset === d.offset ? 'lh-btn-primary' : 'lh-elevated lh-text-sec'
                    }">
                    ${escapeHtml(d.label)}
                  </button>
                `
                )
                .join('')}
            </div>
          </div>

          <!-- UNIFIED CHRONOLOGICAL STREAM -->
          <div class="lh-surface rounded-2xl p-4 sm:p-5 space-y-4">
            <div class="flex flex-wrap items-center justify-between gap-2 pb-3 border-b lh-border">
              <div>
                <h4 class="font-bold text-sm sm:text-base lh-text-main">Chronological Watch Stream (${unified.length})</h4>
                <p class="text-xs lh-text-sec">Live Google Calendar anchors interleaved with workouts, routines &amp; scheduled Harbor Wall tasks</p>
              </div>
              <div class="flex flex-wrap gap-1.5">
                <button onclick="window.Lighthouse.openPdfBuilder()" class="px-2.5 py-1 rounded-lg lh-btn-soft text-xs font-semibold flex items-center gap-1">
                  <i data-lucide="printer" class="w-3.5 h-3.5"></i> Print Night Log
                </button>
                <button onclick="window.Lighthouse.setTab('workouts')" class="px-2.5 py-1 rounded-lg lh-btn-primary text-xs font-semibold flex items-center gap-1">
                  <i data-lucide="dumbbell" class="w-3.5 h-3.5"></i> + Workout
                </button>
                <button onclick="window.Lighthouse.setTab('lists')" class="px-2.5 py-1 rounded-lg lh-elevated text-xs font-medium lh-text-sec hover:lh-text-main">+ Schedule Task</button>
                <button onclick="window.Lighthouse.setTab('morning')" class="px-2.5 py-1 rounded-lg lh-elevated text-xs font-medium lh-text-sec hover:lh-text-main">+ Morning</button>
                <button onclick="window.Lighthouse.setTab('night')" class="px-2.5 py-1 rounded-lg lh-elevated text-xs font-medium lh-text-sec hover:lh-text-main">+ Night</button>
              </div>
            </div>

            ${
              calItems.length === 0
                ? `<div class="p-3 rounded-xl lh-elevated flex flex-wrap items-center justify-between gap-2 text-xs">
                    <div class="flex items-center gap-2 lh-text-sec">
                      <i data-lucide="calendar-check" class="w-4 h-4 shrink-0" style="color: var(--secondary-accent);"></i>
                      <span>
                        ${
                          isLiveSynced
                            ? `No Google Calendar events on the books for ${selOffset === 0 ? formatShortDate(0) : selOffset === 1 ? formatShortDate(1) : 'the next 2 weeks'}.`
                            : 'No synced Google Calendar events yet — press "Sync Google Calendar" above to load your real schedule.'
                        }
                      </span>
                    </div>
                  </div>`
                : ''
            }

            <div class="space-y-2.5">
              ${
                unified.length === 0
                  ? `<p class="text-xs lh-text-sec py-6 text-center">No scheduled blocks, workouts, or calendar events in this view yet.</p>`
                  : unified
                      .map((item) => {
                        if (item.streamType === 'gcal_event') {
                          const isWifeCal = (item.calendar || '').toLowerCase().includes('wife') || (item.calendar || '').toLowerCase().includes('regla');
                          return `
                            <div class="p-3.5 rounded-xl lh-elevated flex items-center justify-between gap-3 ${item.isMuted ? 'opacity-60' : ''}">
                              <div class="min-w-0">
                                <div class="flex items-center gap-2 text-xs flex-wrap">
                                  <span class="font-mono-code font-semibold" style="color: var(--secondary-accent);">${escapeHtml(item.startTime)} – ${escapeHtml(item.endTime)}</span>
                                  ${item.dateStr && selOffset === 2 ? `<span class="text-[10px] font-mono-code px-2 py-0.5 rounded lh-surface lh-text-main">${escapeHtml(formatIsoToShortLabel(item.dateStr))}</span>` : ''}
                                  <span class="text-[10px] px-2 py-0.5 rounded-full lh-badge-sec font-semibold">${escapeHtml(item.calendar || 'Calendar Anchor')}</span>
                                  ${item.isMuted ? '<span class="text-[10px] px-2 py-0.5 rounded-full lh-badge">Muted by Fog Filter</span>' : ''}

    // =========================================================================
    // STATION 3: HARBOR WALL PRO TASK MANAGER (LISTS + SCHEDULING + FOCUS)
    // =========================================================================
    function filterAndSortBoardItems(items) {
      const todayIso = getLocalIsoDate(0);
      const filterMode = state.listFilterMode || 'all';
      const hideDone = Boolean(state.listHideCompleted);
      const q = (state.listSearchQuery || '').trim().toLowerCase();
      const sortBy = state.listSortBy || 'priority';

      const filtered = (items || []).filter((it) => {
        if (hideDone && it.completed) return false;

        if (q) {
          const hay = [
            it.text,
            it.notes,
            it.assignedTo,
            ...(it.tags || []),
            ...(it.subtasks || []).map((s) => s.text)
          ]
            .join(' ')
            .toLowerCase();
          if (!hay.includes(q)) return false;
        }

        if (filterMode === 'today') {
          const d = it.scheduledDate || it.dueDate;
          if (!d || d > todayIso) return false;
        } else if (filterMode === 'high') {
          if (it.priority !== 'p1' && it.priority !== 'p2') return false;
        } else if (filterMode === 'scheduled') {
          if (!it.scheduledDate && !it.watchBlockId) return false;
        } else if (filterMode === 'recurring') {
          if (!it.recurrence || it.recurrence === 'none') return false;
        }
        return true;
      });

      const sorted = [...filtered];
      sorted.sort((a, b) => {
        // Always sink completed tasks to the bottom
        if (Boolean(a.completed) !== Boolean(b.completed)) return a.completed ? 1 : -1;

        if (sortBy === 'priority') {
          const ra = TASK_PRIORITIES[a.priority]?.rank || 3;
          const rb = TASK_PRIORITIES[b.priority]?.rank || 3;
          if (ra !== rb) return ra - rb;
          return (a.dueDate || '9999-99-99').localeCompare(b.dueDate || '9999-99-99');
        }
        if (sortBy === 'dueDate') {
          const da = a.scheduledDate || a.dueDate || '9999-99-99';
          const db = b.scheduledDate || b.dueDate || '9999-99-99';
          if (da !== db) return da.localeCompare(db);
          const ra = TASK_PRIORITIES[a.priority]?.rank || 3;
          const rb = TASK_PRIORITIES[b.priority]?.rank || 3;
          return ra - rb;
        }
        return 0;
      });
      return sorted;
    }

    // =========================================================================
    // FOCUS TIMER TICK HELPER (DOM-TARGETED SO IT NEVER INTERRUPTS TYPING)
    // =========================================================================
    function tickFocusTimer() {
      if (!focusTimer.running) return;
      focusTimer.remainingSec = Math.max(0, focusTimer.remainingSec - 1);
      const clockEl = document.getElementById('focus-timer-clock');
      if (clockEl) clockEl.textContent = formatClockMMSS(focusTimer.remainingSec);
      const barEl = document.getElementById('focus-timer-bar');
      if (barEl && focusTimer.totalSec > 0) {
        const pct = Math.min(100, Math.round(((focusTimer.totalSec - focusTimer.remainingSec) / focusTimer.totalSec) * 100));
        barEl.style.width = `${pct}%`;
      }
      if (focusTimer.remainingSec <= 0) {
        focusTimer.running = false;
        clearInterval(focusTimer.intervalId);
        focusTimer.intervalId = null;
        showToast(`Focus block complete for "${focusTimer.title}"!`);
        renderApp();
      }
    }

    // =========================================================================
    // PAGE-SPECIFIC ACTIONS (WATCHTOWER, WORKOUTS, HARBOR WALL PRO)
    // =========================================================================
    const pageActions = {
      // Watchtower Actions
      setDayOffset(offset) {
        state.selectedDayOffset = offset;
        saveState();
        renderApp();
      },
      togglePeekMuted() {
        state.peekFilteredEvents = !state.peekFilteredEvents;
        renderApp();
      },
      togglePlanLock() {
        state.planLocked = !state.planLocked;
        saveState();
        renderApp();
        showToast(state.planLocked ? 'Locked 24-Hour Watchtower!' : 'Unlocked 24-Hour Watchtower.');
      },
      togglePlanBlock(blockId) {
        let toggledBlock = null;
        state.planBlocks = state.planBlocks.map((b) => {
          if (b.id === blockId) {
            toggledBlock = { ...b, completed: !b.completed };
            return toggledBlock;
          }
          return b;
        });

        // Two-way completion sync back to Harbor Wall Lists
        if (toggledBlock && toggledBlock.sourceType === 'list' && toggledBlock.sourceId) {
          for (const board of state.lists || []) {
            const match = (board.items || []).find((it) => it.id === toggledBlock.sourceId);
            if (match && match.completed !== toggledBlock.completed) {
              this.toggleListItem(board.id, match.id, true);
              break;
            }
          }
        }

        if (toggledBlock && toggledBlock.completed) {
          const targetDate = toggledBlock.dateStr || getLocalIsoDate(toggledBlock.dayOffset || 0);
          const log = ensureDailyLog(targetDate);
          if (toggledBlock.category === 'prayer') log.prayerDone = true;
          else if (toggledBlock.category === 'night') log.nightDone = true;
          else if (toggledBlock.category === 'morning') log.morningDone = true;
          else {
            const exists = (log.todos || []).some((t) => t.text === toggledBlock.title);
            if (!exists) {
              log.todos.push({ id: `dh-${Date.now()}`, text: toggledBlock.title, completed: true });
            }
          }
        }
        saveState();
        renderApp();
      },

      // TWO-WAY REMOVAL: Removing a routine/prayer/task block from Watchtower updates its source board!
      deletePlanBlock(blockId) {
        if (state.planLocked) return showToast('Unlock Watchtower first to remove blocks.');
        const target = (state.planBlocks || []).find((b) => b.id === blockId);
        if (!target) return;

        state.planBlocks = state.planBlocks.filter((b) => b.id !== blockId);

        let syncNote = `Removed "${target.title}" from Watchtower.`;
        if (target.sourceType === 'morning' && target.sourceId) {
          state.morningBoardIds = (state.morningBoardIds || []).filter((id) => id !== target.sourceId);
          syncNote = `Removed "${target.title}" from Watchtower & Morning Board.`;
        } else if (target.sourceType === 'night' && target.sourceId) {
          state.nightBoardIds = (state.nightBoardIds || []).filter((id) => id !== target.sourceId);
          syncNote = `Removed "${target.title}" from Watchtower & Night Watch Board.`;
        } else if (target.sourceType === 'prayer' && target.sourceId) {
          state.prayerCards = (state.prayerCards || []).map((c) =>
            c.id === target.sourceId ? { ...c, onActiveBoard: false } : c
          );
          syncNote = `Removed "${target.title}" from Watchtower & unpinned from Prayer Board.`;
        } else if (target.sourceType === 'list') {
          state.lists = (state.lists || []).map((b) => ({
            ...b,
            items: (b.items || []).map((it) =>
              it.id === target.sourceId || it.watchBlockId === target.id
                ? { ...it, watchBlockId: null, scheduledDate: '' }
                : it
            )
          }));
          syncNote = `Unscheduled "${target.title}" from Watchtower (task kept in Harbor Wall).`;
        }

        saveState();
        renderApp();
        showToast(syncNote);
      },

      addCustomWatchBlock() {
        if (state.planLocked) return showToast('Unlock Watchtower first to add blocks.');
        const titleEl = document.getElementById('quick-plan-title');
        const timeEl = document.getElementById('quick-plan-time');
        const title = (titleEl?.value || '').trim();
        if (!title) return;
        const offset = state.selectedDayOffset > 1 ? 1 : state.selectedDayOffset;
        state.planBlocks.push({
          id: `pb-${Date.now()}`,
          title,
          startTime: timeEl?.value || '15:00',
          durationMins: 25,
          category: 'custom',
          dateStr: getLocalIsoDate(offset),
          completed: false,
          dayOffset: offset
        });
        saveState();
        renderApp();
        showToast(`Added "${title}" to 24h Watchtower!`);
      },

      // Workout Planner Actions
      handleWorkoutModalityChange(selectId, customInputId) {
        const sel = document.getElementById(selectId);
        const inp = document.getElementById(customInputId);
        if (!sel || !inp) return;
        if (sel.value === 'Custom / Other...') {
          inp.classList.remove('hidden');
          inp.focus();
        } else {
          inp.classList.add('hidden');
        }
      },
      resolveWorkoutModality(selectId, customInputId) {
        const selVal = document.getElementById(selectId)?.value || 'Indoor Spinning';
        if (selVal === 'Custom / Other...') {
          const customVal = (document.getElementById(customInputId)?.value || '').trim();
          return customVal || 'Custom Workout';
        }
        return selVal;
      },
      createWorkout(markCompletedImmediately = false) {
        const modality = this.resolveWorkoutModality('wk-modality', 'wk-custom-modality');
        const rawTitle = (document.getElementById('wk-title')?.value || '').trim();
        const title = rawTitle || `${modality} Session`;
        const date = document.getElementById('wk-date')?.value || getLocalIsoDate(0);
        const startTime = document.getElementById('wk-time')?.value || '06:00';
        const durationMins = Number(document.getElementById('wk-duration')?.value) || 45;
        const intensity = document.getElementById('wk-intensity')?.value || 'Moderate';
        const videoOrRoute = (document.getElementById('wk-route')?.value || '').trim();
        const notes = (document.getElementById('wk-notes')?.value || '').trim();

        if (!Array.isArray(state.workouts)) state.workouts = [];
        state.workouts.unshift({
          id: `wk-${Date.now()}`,
          date,
          startTime,
          durationMins,
          modality,
          title,
          videoOrRoute,
          intensity,
          notes,
          completed: Boolean(markCompletedImmediately)
        });
        ensureDailyLog(date);
        saveState();
        renderApp();
        showToast(
          markCompletedImmediately
            ? `Logged completed ${modality}: "${title}" on ${date}!`
            : `Scheduled ${modality}: "${title}" on ${date} (${startTime})!`
        );
      },
      toggleWorkoutCompleted(workoutId) {
        state.workouts = (state.workouts || []).map((w) =>
          w.id === workoutId ? { ...w, completed: !w.completed } : w
        );
        saveState();
        renderApp();
        showToast('Updated workout status!');
      },
      deleteWorkout(workoutId) {
        state.workouts = (state.workouts || []).filter((w) => w.id !== workoutId);
        saveState();
        renderApp();
      },
      setWorkoutFilter(mod) {
        state.workoutFilterModality = mod;
        renderApp();
      },

      // =========================================================================
      // HARBOR WALL PRO TASK MANAGER ACTIONS
      // =========================================================================
      setListFilter(mode) {
        state.listFilterMode = mode;
        renderApp();
      },
      setListSort(sortBy) {
        state.listSortBy = sortBy;
        saveState();
        renderApp();
      },
      toggleHideCompleted() {
        state.listHideCompleted = !state.listHideCompleted;
        saveState();
        renderApp();
      },
      updateListSearch(val) {
        state.listSearchQuery = val;
        const grid = document.getElementById('harbor-boards-container');
        if (grid) {
          grid.innerHTML = renderHarborBoardsGridHtml();
          if (window.lucide) window.lucide.createIcons();
        }
      },
      createListBoard() {
        const el = document.getElementById('new-board-title');
        const title = (el?.value || '').trim();
        if (!title) return;
        state.lists.push({ id: `list-${Date.now()}`, title, category: 'Household', items: [] });
        saveState();
        renderApp();
        showToast(`Created "${title}" board!`);
      },
      deleteListBoard(boardId) {
        const board = (state.lists || []).find((b) => b.id === boardId);
        if (board) {
          const itemIds = new Set((board.items || []).map((i) => i.id));
          state.planBlocks = (state.planBlocks || []).filter(
            (pb) => !(pb.sourceType === 'list' && itemIds.has(pb.sourceId))
          );
        }
        state.lists = state.lists.filter((b) => b.id !== boardId);
        saveState();
        renderApp();
      },
      clearCompletedInBoard(boardId) {
        state.lists = state.lists.map((b) =>
          b.id === boardId ? { ...b, items: (b.items || []).filter((it) => !it.completed) } : b
        );
        saveState();
        renderApp();
        showToast('Cleared completed tasks from board.');
      },
      quickCaptureProTask() {
        const inputEl = document.getElementById('pro-quick-capture');
        const boardId = document.getElementById('pro-quick-board')?.value || state.lists?.[0]?.id;
        const raw = (inputEl?.value || '').trim();
        if (!raw || !boardId) return;
        this.insertParsedTask(boardId, raw);
      },
      addListItem(boardId) {
        const el = document.getElementById(`list-input-${boardId}`);
        const raw = (el?.value || '').trim();
        if (!raw) return;
        this.insertParsedTask(boardId, raw);
      },
      insertParsedTask(boardId, rawText) {
        const board = (state.lists || []).find((b) => b.id === boardId);
        if (!board) return;
        const parsed = parseNaturalTaskInput(rawText);
        const newItem = {
          id: `li-${Date.now()}-${Math.random().toString(36).slice(2, 5)}`,
          text: parsed.text || rawText,
          assignedTo: parsed.assignedTo,
          completed: false,
          priority: parsed.priority,
          dueDate: parsed.dueDate,
          scheduledDate: '',
          scheduledTime: parsed.scheduledTime,
          durationMins: parsed.durationMins,
          recurrence: parsed.recurrence,
          tags: parsed.tags,
          notes: '',
          subtasks: [],
          watchBlockId: null
        };
        board.items.unshift(newItem);

        if (parsed.autoSchedule && !state.planLocked) {
          upsertWatchBlockForTask(board, newItem, parsed.scheduledDate, parsed.scheduledTime, parsed.durationMins);
        }

        saveState();
        renderApp();
        showToast(
          parsed.autoSchedule
            ? `Added "${newItem.text}" & scheduled on Watchtower (${parsed.scheduledDate} @ ${parsed.scheduledTime})!`
            : `Added "${newItem.text}" to ${board.title}!`
        );
      },
      toggleListItem(boardId, itemId, skipWatchSync = false) {
        const { board, item } = findListItem(boardId, itemId);
        if (!board || !item) return;

        const nextCompleted = !item.completed;

        // Auto-advance recurring task when checked off
        if (nextCompleted && item.recurrence && item.recurrence !== 'none') {
          const todayIso = getLocalIsoDate(0);
          const todayLog = ensureDailyLog(todayIso);
          const logText = `[${board.title}] ${item.text}`;
          if (!(todayLog.todos || []).some((t) => t.text === logText)) {
            todayLog.todos.push({ id: `dh-${Date.now()}`, text: logText, completed: true });
          }

          const baseDate = item.scheduledDate || item.dueDate || todayIso;
          const nextDate = getNextRecurrenceDate(baseDate, item.recurrence);
          item.dueDate = nextDate;
          item.subtasks = (item.subtasks || []).map((s) => ({ ...s, completed: false }));
          item.completed = false;

          if (item.scheduledDate || item.watchBlockId) {
            upsertWatchBlockForTask(board, item, nextDate, item.scheduledTime, item.durationMins);
          }

          saveState();
          renderApp();
          showToast(`Completed "${item.text}"! Next ${item.recurrence} occurrence set for ${formatIsoToShortLabel(nextDate)}.`);
          return;
        }

        item.completed = nextCompleted;

        // Sync completion state with Watchtower block if linked
        if (!skipWatchSync && item.watchBlockId) {
          state.planBlocks = (state.planBlocks || []).map((pb) =>
            pb.id === item.watchBlockId ? { ...pb, completed: nextCompleted } : pb
          );
        }

        if (nextCompleted) {
          const todayLog = ensureDailyLog(getLocalIsoDate(0));
          const logText = `[${board.title}] ${item.text}`;
          if (!(todayLog.todos || []).some((t) => t.text === logText)) {
            todayLog.todos.push({ id: `dh-${Date.now()}`, text: logText, completed: true });
          }
        }
        saveState();
        renderApp();
      },
      quickScheduleTaskToday(boardId, itemId) {
        if (state.planLocked) return showToast('Unlock 24h Watchtower first.');
        const { board, item } = findListItem(boardId, itemId);
        if (!board || !item) return;
        const targetDate = item.dueDate && item.dueDate >= getLocalIsoDate(0) ? item.dueDate : getLocalIsoDate(0);
        upsertWatchBlockForTask(board, item, targetDate, item.scheduledTime || '15:00', item.durationMins || 30);
        saveState();
        renderApp();
        showToast(`Scheduled "${item.text}" on Watchtower (${formatIsoToShortLabel(targetDate)} @ ${item.scheduledTime})!`);
      },
      openTaskProModal(boardId, itemId) {
        const { board, item } = findListItem(boardId, itemId);
        if (!board || !item) return;
        activeTaskModalRef = { boardId, itemId };
        const modal = document.getElementById('task-pro-modal');
        if (!modal) return;
        modal.classList.remove('hidden');
        modal.classList.add('flex');
        renderTaskProModalBody();
      },
      closeTaskProModal() {
        const modal = document.getElementById('task-pro-modal');
        if (!modal) return;
        modal.classList.add('hidden');
        modal.classList.remove('flex');
        activeTaskModalRef = null;
      },
      saveTaskProModal(alsoSchedule = false) {
        if (!activeTaskModalRef) return;
        const { board: oldBoard, item } = findListItem(activeTaskModalRef.boardId, activeTaskModalRef.itemId);
        if (!oldBoard || !item) return;

        const nextText = (document.getElementById('tm-text')?.value || '').trim();
        if (!nextText) return showToast('Task title cannot be empty.');

        item.text = nextText;
        item.priority = document.getElementById('tm-priority')?.value || 'p3';
        item.dueDate = document.getElementById('tm-due')?.value || '';
        item.recurrence = document.getElementById('tm-recurrence')?.value || 'none';
        item.assignedTo = (document.getElementById('tm-assignee')?.value || '').trim() || 'Dan';
        item.notes = (document.getElementById('tm-notes')?.value || '').trim();
        item.tags = (document.getElementById('tm-tags')?.value || '')
          .split(',')
          .map((t) => t.trim().replace(/^#/, '').toLowerCase())
          .filter(Boolean);

        const schedDate = document.getElementById('tm-sched-date')?.value || getLocalIsoDate(0);
        const schedTime = document.getElementById('tm-sched-time')?.value || '15:00';
        const durationMins = Math.max(5, Number(document.getElementById('tm-duration')?.value) || 30);
        item.scheduledTime = schedTime;
        item.durationMins = durationMins;

        // Handle moving task to another board
        const targetBoardId = document.getElementById('tm-board')?.value || oldBoard.id;
        let activeBoard = oldBoard;
        if (targetBoardId !== oldBoard.id) {
          const newBoard = (state.lists || []).find((b) => b.id === targetBoardId);
          if (newBoard) {
            oldBoard.items = oldBoard.items.filter((i) => i.id !== item.id);
            newBoard.items.unshift(item);
            activeBoard = newBoard;
          }
        }

        if (alsoSchedule || item.watchBlockId) {
          if (state.planLocked && alsoSchedule) {
            showToast('Saved task details (unlock Watchtower to change calendar blocks).');
          } else {
            upsertWatchBlockForTask(activeBoard, item, schedDate, schedTime, durationMins);
          }
        }

        saveState();
        this.closeTaskProModal();
        renderApp();
        showToast(
          alsoSchedule
            ? `Scheduled "${item.text}" on Watchtower (${formatIsoToShortLabel(schedDate)} @ ${schedTime})!`
            : `Saved updates to "${item.text}".`
        );
      },
      unscheduleModalTask() {
        if (!activeTaskModalRef) return;
        const { item } = findListItem(activeTaskModalRef.boardId, activeTaskModalRef.itemId);
        if (!item) return;
        state.planBlocks = (state.planBlocks || []).filter(
          (b) => !(b.id === item.watchBlockId || (b.sourceType === 'list' && b.sourceId === item.id))
        );
        item.watchBlockId = null;
        item.scheduledDate = '';
        saveState();
        renderTaskProModalBody();
        renderApp();
        showToast('Removed time-block from Watchtower Calendar.');
      },
      addModalSubtask() {
        if (!activeTaskModalRef) return;
        const { item } = findListItem(activeTaskModalRef.boardId, activeTaskModalRef.itemId);
        const inp = document.getElementById('tm-new-subtask');
        const text = (inp?.value || '').trim();
        if (!item || !text) return;
        if (!Array.isArray(item.subtasks)) item.subtasks = [];
        item.subtasks.push({ id: `st-${Date.now()}`, text, completed: false });
        saveState();
        renderTaskProModalBody();
        renderApp();
      },
      toggleModalSubtask(subId) {
        if (!activeTaskModalRef) return;
        const { item } = findListItem(activeTaskModalRef.boardId, activeTaskModalRef.itemId);
        if (!item) return;
        item.subtasks = (item.subtasks || []).map((s) =>
          s.id === subId ? { ...s, completed: !s.completed } : s
        );
        saveState();
        renderTaskProModalBody();
        renderApp();
      },
      deleteModalSubtask(subId) {
        if (!activeTaskModalRef) return;
        const { item } = findListItem(activeTaskModalRef.boardId, activeTaskModalRef.itemId);
        if (!item) return;
        item.subtasks = (item.subtasks || []).filter((s) => s.id !== subId);
        saveState();
        renderTaskProModalBody();
        renderApp();
      },
      deleteTaskItem(boardId, itemId) {
        const { board, item } = findListItem(boardId, itemId);
        if (!board || !item) return;
        state.planBlocks = (state.planBlocks || []).filter(
          (b) => !(b.id === item.watchBlockId || (b.sourceType === 'list' && b.sourceId === item.id))
        );
        board.items = board.items.filter((i) => i.id !== itemId);
        saveState();
        this.closeTaskProModal();
        renderApp();
        showToast(`Deleted "${item.text}".`);
      },

      // Focus / Pomodoro Timer Actions
      startFocusTimer(boardId, itemId) {
        const { item } = findListItem(boardId, itemId);
        if (!item) return;
        if (focusTimer.intervalId) clearInterval(focusTimer.intervalId);
        const mins = Math.max(5, Math.min(120, Number(item.durationMins) || 25));
        focusTimer.boardId = boardId;
        focusTimer.itemId = itemId;
        focusTimer.title = item.text;
        focusTimer.totalSec = mins * 60;
        focusTimer.remainingSec = mins * 60;
        focusTimer.running = true;
        focusTimer.intervalId = setInterval(tickFocusTimer, 1000);
        renderApp();
        window.scrollTo({ top: 0, behavior: 'smooth' });
        showToast(`Focus timer started (${mins}m): "${item.text}"`);
      },
      toggleFocusTimer() {
        if (!focusTimer.itemId) return;
        focusTimer.running = !focusTimer.running;
        if (focusTimer.running && !focusTimer.intervalId) {
          focusTimer.intervalId = setInterval(tickFocusTimer, 1000);
        } else if (!focusTimer.running && focusTimer.intervalId) {
          clearInterval(focusTimer.intervalId);
          focusTimer.intervalId = null;
        }
        renderApp();
      },
      addFocusMins(mins) {
        focusTimer.remainingSec += mins * 60;
        focusTimer.totalSec += mins * 60;
        const clockEl = document.getElementById('focus-timer-clock');
        if (clockEl) clockEl.textContent = formatClockMMSS(focusTimer.remainingSec);
      },
      stopFocusTimer() {
        if (focusTimer.intervalId) clearInterval(focusTimer.intervalId);
        focusTimer.intervalId = null;
        focusTimer.running = false;
        focusTimer.itemId = null;
        focusTimer.boardId = null;
        renderApp();
      },
      completeFocusTask() {
        const bId = focusTimer.boardId;
        const iId = focusTimer.itemId;
        this.stopFocusTimer();
        if (bId && iId) {
          const { item } = findListItem(bId, iId);
          if (item && !item.completed) {
            this.toggleListItem(bId, iId);
          }
        }
      }
    };

    initLighthousePage({
      page: 'index.html',
      defaultTab: 'calendar',
      renderers: {
        calendar: renderWatchtowerView,
        workouts: renderWorkoutsView,
        lists: renderListsView
      },
      actions: pageActions
    });
  </script>
</body>
</html>
