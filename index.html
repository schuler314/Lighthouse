<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <title>Lighthouse — Watchtower, Workouts &amp; Lists</title>

  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Lucide Icons CDN -->
  <script src="https://unpkg.com/lucide@latest"></script>
  <!-- HTML2PDF Bundle CDN (for shared Night Binder PDF Studio) -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=JetBrains+Mono:wght@400;500;600&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  <!-- Shared Lighthouse Styles -->
  <link rel="stylesheet" href="./styles.css" />
</head>
<body class="min-h-screen flex flex-col md:flex-row">
  <script type="module">
    import {
      WORKOUT_MODALITIES,
      getLocalIsoDate,
      getDayOffsetFromIsoDate,
      formatShortDate,
      formatFullDate
    } from './data.js';
    import {
      state,
      saveState,
      renderApp,
      showToast,
      escapeHtml,
      isEventMuted,
      getEventDayOffset,
      ensureDailyLog,
      initLighthousePage
    } from './core.js';

    function formatIsoToShortLabel(dateStr) {
      if (!dateStr) return '';
      const [y, m, d] = dateStr.split('-').map(Number);
      if (!y || !m || !d) return dateStr;
      return new Date(y, m - 1, d).toLocaleDateString('en-US', {
        weekday: 'short',
        month: 'short',
        day: 'numeric'
      });
    }

    // =========================================================================
    // STATION 1: WATCHTOWER (24H)
    // =========================================================================
    function renderWatchtowerView() {
      const todayIso = getLocalIsoDate(0);
      const selOffset = state.selectedDayOffset;

      const planItems =
        selOffset <= 1
          ? (state.planBlocks || [])
              .filter((b) => b.dayOffset === selOffset)
              .map((b) => ({
                ...b,
                streamType: 'plan_block',
                sortDate: getLocalIsoDate(selOffset),
                sortTime: b.startTime || '08:00'
              }))
          : [];

      const workoutItems = (state.workouts || [])
        .map((w) => ({ ...w, computedOffset: getDayOffsetFromIsoDate(w.date) }))
        .filter((w) => w.computedOffset !== null)
        .filter((w) => (selOffset === 2 ? w.computedOffset >= 2 : w.computedOffset === selOffset))
        .map((w) => ({
          ...w,
          streamType: 'workout_event',
          sortDate: w.date || todayIso,
          sortTime: w.startTime || '06:00'
        }));

      const allDatedGcalForView = (state.gcalEvents || [])
        .map((ev) => ({ ...ev, computedOffset: getEventDayOffset(ev) }))
        .filter((ev) => ev.computedOffset !== null)
        .filter((ev) => (selOffset === 2 ? ev.computedOffset >= 2 : ev.computedOffset === selOffset));

      const calItems = allDatedGcalForView
        .filter((ev) => state.peekFilteredEvents || !isEventMuted(ev))
        .map((ev) => ({
          ...ev,
          streamType: 'gcal_event',
          isMuted: isEventMuted(ev),
          sortDate: ev.dateStr,
          sortTime: ev.startTime || '08:00'
        }));

      const mutedCount = allDatedGcalForView.length - calItems.length;

      const unified = [...calItems, ...workoutItems, ...planItems].sort(
        (a, b) => (a.sortDate || '').localeCompare(b.sortDate || '') || a.sortTime.localeCompare(b.sortTime)
      );

      const syncLabel = state.settings.lastGcalSync || 'Not synced yet';
      const isLiveSynced = syncLabel.startsWith('Live Sync') || syncLabel.startsWith('.ICS Import');
      const activeHeadingDate =
        selOffset === 0
          ? formatFullDate(0)
          : selOffset === 1
          ? formatFullDate(1)
          : `${formatShortDate(2)} – ${formatShortDate(14)}`;

      return `
        <div class="space-y-5">
          <!-- TOP HORIZON BAR -->
          <div class="lh-surface rounded-2xl p-4 sm:p-5 space-y-4">
            <div class="flex flex-wrap items-center justify-between gap-3">
              <div>
                <div class="flex items-center gap-2 flex-wrap">
                  <span class="text-[11px] font-semibold uppercase tracking-wider lh-text-sec">
                    ${escapeHtml(activeHeadingDate)}
                  </span>
                  <button onclick="window.Lighthouse.openGcalModal()"
                    class="text-[10px] font-mono-code px-2 py-0.5 rounded-full ${isLiveSynced ? 'lh-badge-success' : 'lh-badge-sec'} hover:opacity-85">
                    GCal: ${escapeHtml(syncLabel)}
                  </button>
                </div>
                <h3 class="text-lg sm:text-xl font-bold lh-text-main mt-1">Clear the Fog • Lock Your Next 24 Hours</h3>
              </div>
              <div class="flex items-center gap-2">
                <button onclick="window.Lighthouse.togglePeekMuted()"
                  class="px-3 py-1.5 rounded-xl lh-elevated text-xs font-medium lh-text-sec hover:lh-text-main flex items-center gap-1.5">
                  <i data-lucide="${state.peekFilteredEvents ? 'eye-off' : 'eye'}" class="w-3.5 h-3.5"></i>
                  <span>${state.peekFilteredEvents ? 'Hide Muted' : `Peek Muted${mutedCount > 0 ? ` (${mutedCount})` : ''}`}</span>
                </button>
                <button onclick="window.Lighthouse.togglePlanLock()"
                  class="px-3.5 py-1.5 rounded-xl text-xs font-semibold flex items-center gap-1.5 ${
                    state.planLocked ? 'lh-btn-primary' : 'lh-btn-soft'
                  }">
                  <i data-lucide="${state.planLocked ? 'lock' : 'unlock'}" class="w-3.5 h-3.5"></i>
                  <span>${state.planLocked ? 'Watch Locked' : 'Lock 24h Watch'}</span>
                </button>
              </div>
            </div>

            <div class="grid grid-cols-3 gap-2">
              ${[
                { offset: 0, label: `Today • ${formatShortDate(0)}` },
                { offset: 1, label: `Tomorrow • ${formatShortDate(1)}` },
                { offset: 2, label: 'Horizon (+2–14d)' }
              ]
                .map(
                  (d) => `
                  <button onclick="window.Lighthouse.setDayOffset(${d.offset})"
                    class="py-2.5 px-2 sm:px-3 rounded-xl text-[11px] sm:text-xs font-semibold transition truncate ${
                      selOffset === d.offset ? 'lh-btn-primary' : 'lh-elevated lh-text-sec'
                    }">
                    ${escapeHtml(d.label)}
                  </button>
                `
                )
                .join('')}
            </div>
          </div>

          <!-- UNIFIED CHRONOLOGICAL STREAM -->
          <div class="lh-surface rounded-2xl p-4 sm:p-5 space-y-4">
            <div class="flex flex-wrap items-center justify-between gap-2 pb-3 border-b lh-border">
              <div>
                <h4 class="font-bold text-sm sm:text-base lh-text-main">Chronological Watch Stream (${unified.length})</h4>
                <p class="text-xs lh-text-sec">Live Google Calendar anchors interleaved with your scheduled workouts, routines &amp; tasks</p>
              </div>
              <div class="flex flex-wrap gap-1.5">
                <button onclick="window.Lighthouse.openPdfBuilder()" class="px-2.5 py-1 rounded-lg lh-btn-soft text-xs font-semibold flex items-center gap-1">
                  <i data-lucide="printer" class="w-3.5 h-3.5"></i> Print Tonight’s Plan &amp; Log
                </button>
                <button onclick="window.Lighthouse.setTab('workouts')" class="px-2.5 py-1 rounded-lg lh-btn-primary text-xs font-semibold flex items-center gap-1">
                  <i data-lucide="dumbbell" class="w-3.5 h-3.5"></i> + Schedule Workout
                </button>
                <button onclick="window.Lighthouse.setTab('morning')" class="px-2.5 py-1 rounded-lg lh-elevated text-xs font-medium lh-text-sec hover:lh-text-main">+ Morning Ramp</button>
                <button onclick="window.Lighthouse.setTab('night')" class="px-2.5 py-1 rounded-lg lh-elevated text-xs font-medium lh-text-sec hover:lh-text-main">+ Night Watch</button>
                <button onclick="window.Lighthouse.setTab('prayer')" class="px-2.5 py-1 rounded-lg lh-elevated text-xs font-medium lh-text-sec hover:lh-text-main">+ Prayer</button>
              </div>
            </div>

            <!-- LIVE CALENDAR STATUS BANNER WHEN NO GCAL EVENTS ARE IN THIS VIEW -->
            ${
              calItems.length === 0
                ? `<div class="p-3 rounded-xl lh-elevated flex flex-wrap items-center justify-between gap-2 text-xs">
                    <div class="flex items-center gap-2 lh-text-sec">
                      <i data-lucide="calendar" class="w-4 h-4 shrink-0" style="color: var(--secondary-accent);"></i>
                      <span>
                        ${
                          isLiveSynced
                            ? `No Google Calendar events on the books for ${selOffset === 0 ? formatShortDate(0) : selOffset === 1 ? formatShortDate(1) : 'the next 2 weeks'}.`
                            : 'Google Calendar is not synced yet — connect GCal to pull your real schedule.'
                        }
                      </span>
                    </div>
                    <button onclick="window.Lighthouse.openGcalModal()" class="px-2.5 py-1 rounded-lg lh-btn-soft text-[11px] font-semibold shrink-0">
                      ${isLiveSynced ? 'Refresh GCal' : 'Sync GCal Now'}
                    </button>
                  </div>`
                : ''
            }

            <div class="space-y-2.5">
              ${
                unified.length === 0
                  ? `<p class="text-xs lh-text-sec py-6 text-center">No scheduled blocks, workouts, or calendar events in this view yet.</p>`
                  : unified
                      .map((item) => {
                        if (item.streamType === 'gcal_event') {
                          const isWifeCal = (item.calendar || '').toLowerCase().includes('wife') || (item.calendar || '').toLowerCase().includes('regla');
                          return `
                            <div class="p-3.5 rounded-xl lh-elevated flex items-center justify-between gap-3 ${item.isMuted ? 'opacity-60' : ''}">
                              <div class="min-w-0">
                                <div class="flex items-center gap-2 text-xs flex-wrap">
                                  <span class="font-mono-code font-semibold" style="color: var(--secondary-accent);">${escapeHtml(item.startTime)} – ${escapeHtml(item.endTime)}</span>
                                  ${item.dateStr && selOffset === 2 ? `<span class="text-[10px] font-mono-code px-2 py-0.5 rounded lh-surface lh-text-main">${escapeHtml(formatIsoToShortLabel(item.dateStr))}</span>` : ''}
                                  <span class="text-[10px] px-2 py-0.5 rounded-full lh-badge-sec font-semibold">${escapeHtml(item.calendar || 'Calendar Anchor')}</span>
                                  ${item.isMuted ? '<span class="text-[10px] px-2 py-0.5 rounded-full lh-badge">Muted by Fog Filter</span>' : ''}
                                </div>
                                <p class="font-semibold text-sm lh-text-main mt-1">${escapeHtml(item.title)}</p>
                                ${item.location ? `<p class="text-xs lh-text-sec truncate">📍 ${escapeHtml(item.location)}</p>` : ''}
                              </div>
                              ${
                                isWifeCal && !item.isMuted
                                  ? `<button onclick="window.Lighthouse.quickMuteEventTitle('${escapeHtml(item.title).replace(/'/g, "\\'")}')" class="px-2.5 py-1 rounded-lg lh-surface text-[10px] font-semibold lh-text-sec hover:lh-text-main shrink-0" title="Mute reminders like this">
                                      Mute
                                    </button>`
                                  : ''
                              }
                            </div>
                          `;
                        }

                        if (item.streamType === 'workout_event') {
                          return `
                            <div class="p-3.5 rounded-xl lh-surface border-l-4 flex items-center justify-between gap-3 ${item.completed ? 'opacity-60' : ''}" style="border-left-color: var(--success-accent);">
                              <div class="flex items-center gap-3 min-w-0">
                                <button onclick="window.Lighthouse.toggleWorkoutCompleted('${item.id}')"
                                  class="w-6 h-6 rounded-lg flex items-center justify-center border lh-border shrink-0"
                                  style="${item.completed ? 'background-color: var(--success-accent); color: var(--accent-contrast);' : ''}">
                                  ${item.completed ? '<i data-lucide="check" class="w-4 h-4"></i>' : ''}
                                </button>
                                <div class="min-w-0">
                                  <div class="flex items-center gap-2 flex-wrap">
                                    <span class="font-mono-code text-xs font-semibold" style="color: var(--success-accent);">${escapeHtml(item.startTime)}</span>
                                    <span class="text-xs lh-text-muted">${item.durationMins}m</span>
                                    <span class="text-[10px] uppercase tracking-wider px-2 py-0.5 rounded-full lh-badge-success font-bold">
                                      🏋️ ${escapeHtml(item.modality)}
                                    </span>
                                    ${item.computedOffset >= 2 ? `<span class="text-[10px] font-mono-code px-2 py-0.5 rounded lh-elevated lh-text-main">${escapeHtml(formatIsoToShortLabel(item.date))}</span>` : ''}
                                  </div>
                                  <p class="text-sm font-bold lh-text-main mt-0.5 ${item.completed ? 'line-through lh-text-muted' : ''}">${escapeHtml(item.title)}</p>
                                  ${item.videoOrRoute || item.notes ? `<p class="text-xs lh-text-sec truncate">${escapeHtml(item.videoOrRoute || '')} ${item.notes ? '• ' + escapeHtml(item.notes) : ''}</p>` : ''}
                                </div>
                              </div>
                              <button onclick="window.Lighthouse.setTab('workouts')" class="px-2.5 py-1 rounded-lg lh-elevated text-[11px] font-semibold lh-text-sec hover:lh-text-main shrink-0">
                                Edit
                              </button>
                            </div>
                          `;
                        }

                        return `
                          <div class="p-3.5 rounded-xl lh-surface flex items-center justify-between gap-3 ${item.completed ? 'opacity-55' : ''}">
                            <div class="flex items-center gap-3 min-w-0">
                              <button onclick="window.Lighthouse.togglePlanBlock('${item.id}')"
                                class="w-6 h-6 rounded-lg flex items-center justify-center border lh-border shrink-0"
                                style="${item.completed ? 'background-color: var(--success-accent); color: var(--accent-contrast);' : ''}">
                                ${item.completed ? '<i data-lucide="check" class="w-4 h-4"></i>' : ''}
                              </button>
                              <div class="min-w-0">
                                <div class="flex items-center gap-2">
                                  <span class="font-mono-code text-xs font-semibold" style="color: var(--accent-primary);">${escapeHtml(item.startTime)}</span>
                                  <span class="text-xs lh-text-muted">${item.durationMins}m</span>
                                  <span class="text-[10px] uppercase tracking-wider px-2 py-0.5 rounded-full lh-badge font-semibold">${escapeHtml(item.category)}</span>
                                </div>
                                <p class="text-sm font-medium lh-text-main mt-0.5 ${item.completed ? 'line-through lh-text-muted' : ''}">${escapeHtml(item.title)}</p>
                              </div>
                            </div>
                            ${
                              !state.planLocked
                                ? `<button onclick="window.Lighthouse.deletePlanBlock('${item.id}')" class="p-1.5 rounded-lg lh-text-muted hover:lh-text-main"><i data-lucide="trash-2" class="w-4 h-4"></i></button>`
                                : ''
                            }
                          </div>
                        `;
                      })
                      .join('')
              }
            </div>

            <!-- QUICK ADD BLOCK -->
            <div class="pt-3 border-t lh-border grid grid-cols-1 sm:grid-cols-4 gap-2">
              <input id="quick-plan-title" type="text"
                onkeydown="if(event.key==='Enter') window.Lighthouse.addCustomWatchBlock()"
                placeholder="Add custom watch block..." class="sm:col-span-2 px-3 py-2 rounded-xl lh-input" />
              <input id="quick-plan-time" type="time" value="15:00" class="px-3 py-2 rounded-xl lh-input font-mono-code" />
              <button onclick="window.Lighthouse.addCustomWatchBlock()" class="py-2 px-4 rounded-xl lh-btn-primary text-xs">
                + Add to 24h Watch
              </button>
            </div>
          </div>
        </div>
      `;
    }

    // =========================================================================
    // STATION 2: TRAINING & WORKOUTS PLANNER / CALENDAR SCHEDULER
    // =========================================================================
    function renderWorkoutsView() {
      const filterMod = state.workoutFilterModality || 'All';
      const allWorkouts = [...(state.workouts || [])].sort(
        (a, b) => (b.date || '').localeCompare(a.date || '') || (a.startTime || '').localeCompare(b.startTime || '')
      );
      const filteredWorkouts =
        filterMod === 'All'
          ? allWorkouts
          : allWorkouts.filter((w) => (w.modality || '').toLowerCase() === filterMod.toLowerCase());

      const completedCount = allWorkouts.filter((w) => w.completed).length;
      const totalMinsCompleted = allWorkouts
        .filter((w) => w.completed)
        .reduce((acc, w) => acc + (Number(w.durationMins) || 0), 0);

      const filterPills = [
        'All',
        'Indoor Spinning',
        'Outdoor Cycling (Road)',
        'Outdoor Cycling (Single-Track)',
        'Lifting (Video-Led)',
        'Pilates / Mobility',
        'Yoga',
        'Walking'
      ];

      return `
        <div class="space-y-6">
          <!-- TOP TRAINING BANNER & STATS -->
          <div class="lh-surface rounded-2xl p-4 sm:p-6 flex flex-wrap items-center justify-between gap-4 border-l-4" style="border-left-color: var(--success-accent);">
            <div>
              <div class="flex items-center gap-2 flex-wrap">
                <span class="text-[11px] font-semibold uppercase tracking-wider px-2.5 py-0.5 rounded-full lh-badge-success">
                  Training &amp; Conditioning Deck
                </span>
                <span class="text-xs font-mono-code lh-text-sec">
                  ${completedCount} Sessions Logged • ${totalMinsCompleted} Total Mins
                </span>
              </div>
              <h3 class="text-lg sm:text-xl font-bold lh-text-main mt-1">Workout Planner &amp; Calendar Scheduler</h3>
              <p class="text-xs lh-text-sec">
                Schedule Indoor Spinning, Road or Single-Track Cycling, Video-Led Lifting, Pilates/Mobility, Yoga, Walking, or any custom session directly onto your Watchtower Calendar and Daily Course Log.
              </p>
            </div>
            <button onclick="window.Lighthouse.setTab('goals')"
              class="px-3.5 py-2 rounded-xl lh-btn-soft text-xs font-bold flex items-center gap-1.5 shrink-0">
              <i data-lucide="history" class="w-4 h-4"></i>
              <span>View Daily History &amp; Backtrack</span>
            </button>
          </div>

          <!-- SCHEDULE OR LOG WORKOUT FORM -->
          <div class="lh-surface rounded-2xl p-4 sm:p-6 space-y-4">
            <div class="flex items-center justify-between border-b lh-border pb-2.5">
              <h4 class="font-bold text-sm sm:text-base lh-text-main flex items-center gap-2">
                <i data-lucide="calendar-plus" class="w-4 h-4" style="color: var(--accent-primary);"></i>
                <span>Schedule or Log a Workout Session</span>
              </h4>
              <span class="text-xs lh-text-sec">Auto-syncs to Watchtower Calendar &amp; Daily Log</span>
            </div>

            <div class="grid grid-cols-1 sm:grid-cols-12 gap-3">
              <div class="sm:col-span-4 space-y-2">
                <label class="text-xs font-semibold lh-text-sec block">1. Activity / Modality</label>
                <select id="wk-modality"
                  onchange="window.Lighthouse.handleWorkoutModalityChange('wk-modality', 'wk-custom-modality')"
                  class="w-full px-3 py-2.5 rounded-xl lh-input">
                  ${WORKOUT_MODALITIES.map((m) => `<option value="${escapeHtml(m)}">${escapeHtml(m)}</option>`).join('')}
                </select>
                <input id="wk-custom-modality" type="text"
                  placeholder="Type custom workout activity (e.g. Rowing, Rucking, Swimming)..."
                  class="hidden w-full px-3 py-2.5 rounded-xl lh-input" />
              </div>

              <div class="sm:col-span-5 space-y-2">
                <label class="text-xs font-semibold lh-text-sec block">2. Workout Title / Focus</label>
                <input id="wk-title" type="text"
                  placeholder="e.g. 45m Zone 2 Spin, Upper Body Video Lift, Trail Ride..."
                  class="w-full px-3.5 py-2.5 rounded-xl lh-input" />
              </div>

              <div class="sm:col-span-3 space-y-2">
                <label class="text-xs font-semibold lh-text-sec block">3. Date</label>
                <input id="wk-date" type="date" value="${getLocalIsoDate(0)}"
                  class="w-full px-3 py-2.5 rounded-xl lh-input font-mono-code" />
              </div>
            </div>

            <div class="grid grid-cols-2 sm:grid-cols-12 gap-3">
              <div class="col-span-1 sm:col-span-3">
                <label class="text-xs font-semibold lh-text-sec block mb-1">Start Time</label>
                <input id="wk-time" type="time" value="06:00"
                  class="w-full px-3 py-2 rounded-xl lh-input font-mono-code" />
              </div>
              <div class="col-span-1 sm:col-span-2">
                <label class="text-xs font-semibold lh-text-sec block mb-1">Duration (m)</label>
                <input id="wk-duration" type="number" min="5" max="360" step="5" value="45"
                  class="w-full px-3 py-2 rounded-xl lh-input font-mono-code" />
              </div>
              <div class="col-span-2 sm:col-span-3">
                <label class="text-xs font-semibold lh-text-sec block mb-1">Intensity / Effort</label>
                <select id="wk-intensity" class="w-full px-3 py-2 rounded-xl lh-input">
                  <option value="Recovery / Zone 1">Recovery / Zone 1</option>
                  <option value="Zone 2 Base Endurance" selected>Zone 2 Base Endurance</option>
                  <option value="Moderate / Tempo">Moderate / Tempo</option>
                  <option value="High / Threshold">High / Threshold</option>
                  <option value="Strength / Hypertrophy">Strength / Hypertrophy</option>
                </select>
              </div>
              <div class="col-span-2 sm:col-span-4">
                <label class="text-xs font-semibold lh-text-sec block mb-1">Video Channel / Trail / Route</label>
                <input id="wk-route" type="text"
                  placeholder="e.g. Caroline Girvan, Peloton, DuPont Single-Track..."
                  class="w-full px-3 py-2 rounded-xl lh-input" />
              </div>
            </div>

            <input id="wk-notes" type="text"
              placeholder="Optional notes (weights used, average watts, tendon feel, or mileage)..."
              class="w-full px-3.5 py-2.5 rounded-xl lh-input" />

            <div class="flex flex-wrap items-center gap-2.5 pt-1">
              <button onclick="window.Lighthouse.createWorkout(false)"
                class="py-2.5 px-5 rounded-xl lh-btn-primary text-xs sm:text-sm font-bold flex items-center gap-2">
                <i data-lucide="calendar" class="w-4 h-4"></i>
                <span>+ Schedule on Calendar</span>
              </button>
              <button onclick="window.Lighthouse.createWorkout(true)"
                class="py-2.5 px-4 rounded-xl lh-btn-soft text-xs sm:text-sm font-bold flex items-center gap-2">
                <i data-lucide="check-circle-2" class="w-4 h-4"></i>
                <span>✓ Log as Completed Now</span>
              </button>
            </div>
          </div>

          <!-- FILTER BY MODALITY & WORKOUT SCHEDULE LIST -->
          <div class="space-y-3">
            <div class="flex items-center justify-between flex-wrap gap-2">
              <h4 class="text-sm font-bold lh-text-main">Scheduled &amp; Logged Workouts (${filteredWorkouts.length})</h4>
              <span class="text-xs lh-text-sec">Checking off a workout automatically records it in your Daily Course History</span>
            </div>

            <div class="flex items-center gap-1.5 overflow-x-auto no-scrollbar pb-1">
              ${filterPills
                .map(
                  (mod) => `
                  <button onclick="window.Lighthouse.setWorkoutFilter('${mod}')"
                    class="px-3 py-1.5 rounded-xl text-xs font-semibold shrink-0 transition ${
                      filterMod === mod ? 'lh-btn-primary' : 'lh-surface lh-text-sec'
                    }">
                    ${escapeHtml(mod)}
                  </button>
                `
                )
                .join('')}
            </div>

            <div class="grid grid-cols-1 md:grid-cols-2 gap-3.5">
              ${
                filteredWorkouts.length === 0
                  ? `<p class="text-xs lh-text-sec py-6 text-center md:col-span-2 lh-surface rounded-2xl">No workouts found for this filter. Use the scheduler above to add one!</p>`
                  : filteredWorkouts
                      .map(
                        (w) => `
                        <div class="lh-surface rounded-2xl p-4 flex flex-col justify-between gap-3 ${w.completed ? 'opacity-75' : ''}">
                          <div class="flex items-start justify-between gap-3">
                            <div class="flex items-start gap-3 min-w-0">
                              <button onclick="window.Lighthouse.toggleWorkoutCompleted('${w.id}')"
                                class="mt-0.5 w-6 h-6 rounded-lg border lh-border flex items-center justify-center shrink-0"
                                style="${w.completed ? 'background-color: var(--success-accent); color: var(--accent-contrast);' : ''}">
                                ${w.completed ? '<i data-lucide="check" class="w-4 h-4"></i>' : ''}
                              </button>
                              <div class="min-w-0 space-y-1">
                                <div class="flex items-center gap-2 flex-wrap">
                                  <span class="text-[10px] font-bold uppercase px-2 py-0.5 rounded-full lh-badge-success">
                                    ${escapeHtml(w.modality)}
                                  </span>
                                  <span class="text-xs font-mono-code lh-text-sec">
                                    ${escapeHtml(w.date)} • ${escapeHtml(w.startTime)} (${w.durationMins}m)
                                  </span>
                                </div>
                                <h4 class="font-bold text-sm sm:text-base lh-text-main ${w.completed ? 'line-through lh-text-muted' : ''}">
                                  ${escapeHtml(w.title)}
                                </h4>
                                ${
                                  w.videoOrRoute
                                    ? `<p class="text-xs font-medium" style="color: var(--secondary-accent);">📍 ${escapeHtml(w.videoOrRoute)} • ${escapeHtml(w.intensity || 'Moderate')}</p>`
                                    : ''
                                }
                                ${w.notes ? `<p class="text-xs lh-text-sec leading-relaxed">${escapeHtml(w.notes)}</p>` : ''}
                              </div>
                            </div>
                            <button onclick="window.Lighthouse.deleteWorkout('${w.id}')"
                              class="p-1.5 rounded-lg lh-text-muted hover:lh-text-main shrink-0" title="Delete Workout">
                              <i data-lucide="trash-2" class="w-4 h-4"></i>
                            </button>
                          </div>

                          <div class="pt-2.5 border-t lh-border flex items-center justify-between gap-2">
                            <span class="text-[11px] font-semibold ${w.completed ? 'lh-text-main' : 'lh-text-sec'}" style="${w.completed ? 'color: var(--success-accent);' : ''}">
                              ${w.completed ? '✓ Logged in Daily History' : 'Scheduled on Calendar'}
                            </span>
                            <div class="flex items-center gap-1.5">
                              <button onclick="window.Lighthouse.toggleWorkoutCompleted('${w.id}')"
                                class="px-2.5 py-1 rounded-lg text-xs font-semibold ${w.completed ? 'lh-elevated lh-text-sec' : 'lh-btn-primary'}">
                                ${w.completed ? 'Mark Incomplete' : '✓ Mark Done'}
                              </button>
                            </div>
                          </div>
                        </div>
                      `
                      )
                      .join('')
              }
            </div>
          </div>
        </div>
      `;
    }

    // =========================================================================
    // STATION 3: HARBOR WALL LISTS (FAMILY WALL EXPERIENCE)
    // =========================================================================
    function renderListsView() {
      return `
        <div class="space-y-5">
          <div class="lh-surface rounded-2xl p-4 sm:p-5 flex flex-col sm:flex-row sm:items-center justify-between gap-4">
            <div>
              <span class="text-[11px] font-semibold uppercase tracking-wider lh-text-sec">Family Wall Experience</span>
              <h3 class="text-lg sm:text-xl font-bold lh-text-main mt-0.5">Harbor Wall Shared Lists</h3>
              <p class="text-xs lh-text-sec">Organize family, grocery, and workbench items—and push any item directly onto your 24h Watchtower.</p>
            </div>
            <div class="flex items-center gap-2">
              <input id="new-board-title" type="text"
                onkeydown="if(event.key==='Enter') window.Lighthouse.createListBoard()"
                placeholder="New list board name..." class="px-3 py-2 rounded-xl lh-input" />
              <button onclick="window.Lighthouse.createListBoard()" class="px-4 py-2.5 rounded-xl lh-btn-primary text-xs shrink-0">+ Board</button>
            </div>
          </div>

          <div class="grid grid-cols-1 md:grid-cols-3 gap-4">
            ${(state.lists || [])
              .map(
                (board) => `
                <div class="lh-surface rounded-2xl p-4 sm:p-5 flex flex-col justify-between space-y-4">
                  <div class="space-y-3">
                    <div class="flex items-center justify-between pb-2.5 border-b lh-border">
                      <div>
                        <span class="text-[10px] font-semibold uppercase tracking-wider" style="color: var(--accent-primary);">${escapeHtml(board.category)}</span>
                        <h4 class="font-bold text-base lh-text-main">${escapeHtml(board.title)}</h4>
                      </div>
                      <button onclick="window.Lighthouse.deleteListBoard('${board.id}')" class="p-1.5 lh-text-muted hover:lh-text-main">
                        <i data-lucide="trash-2" class="w-4 h-4"></i>
                      </button>
                    </div>

                    <div class="space-y-2">
                      ${(board.items || [])
                        .map(
                          (item) => `
                          <div class="p-3 rounded-xl lh-elevated flex items-start justify-between gap-2 ${item.completed ? 'opacity-55' : ''}">
                            <div class="flex items-start gap-2.5 min-w-0">
                              <button onclick="window.Lighthouse.toggleListItem('${board.id}', '${item.id}')"
                                class="mt-0.5 w-5 h-5 rounded-md border lh-border flex items-center justify-center shrink-0"
                                style="${item.completed ? 'background-color: var(--success-accent); color: var(--accent-contrast);' : ''}">
                                ${item.completed ? '<i data-lucide="check" class="w-3.5 h-3.5"></i>' : ''}
                              </button>
                              <div class="min-w-0">
                                <p class="text-xs sm:text-sm font-medium lh-text-main ${item.completed ? 'line-through lh-text-muted' : ''}">${escapeHtml(item.text)}</p>
                                <span class="text-[11px] lh-text-sec">${escapeHtml(item.assignedTo || 'Shared')}</span>
                              </div>
                            </div>
                            <button onclick="window.Lighthouse.pushListItemToWatch('${board.id}', '${item.id}')"
                              class="px-2 py-1 rounded-lg lh-btn-soft text-[10px] shrink-0">
                              + 24h
                            </button>
                          </div>
                        `
                        )
                        .join('')}
                    </div>
                  </div>

                  <div class="pt-3 border-t lh-border flex items-center gap-2">
                    <input id="list-input-${board.id}" type="text"
                      onkeydown="if(event.key==='Enter') window.Lighthouse.addListItem('${board.id}')"
                      placeholder="Add item..." class="flex-1 px-3 py-2 rounded-xl lh-input" />
                    <button onclick="window.Lighthouse.addListItem('${board.id}')" class="p-2.5 rounded-xl lh-btn-primary shrink-0">
                      <i data-lucide="plus" class="w-4 h-4"></i>
                    </button>
                  </div>
                </div>
              `
              )
              .join('')}
          </div>
        </div>
      `;
    }

    // =========================================================================
    // PAGE-SPECIFIC ACTIONS (WATCHTOWER, WORKOUTS, LISTS)
    // =========================================================================
    const pageActions = {
      // Watchtower Actions
      setDayOffset(offset) {
        state.selectedDayOffset = offset;
        saveState();
        renderApp();
      },
      togglePeekMuted() {
        state.peekFilteredEvents = !state.peekFilteredEvents;
        renderApp();
      },
      togglePlanLock() {
        state.planLocked = !state.planLocked;
        saveState();
        renderApp();
        showToast(state.planLocked ? 'Locked 24-Hour Watchtower!' : 'Unlocked 24-Hour Watchtower.');
      },
      togglePlanBlock(blockId) {
        let toggledBlock = null;
        state.planBlocks = state.planBlocks.map((b) => {
          if (b.id === blockId) {
            toggledBlock = { ...b, completed: !b.completed };
            return toggledBlock;
          }
          return b;
        });
        if (toggledBlock && toggledBlock.completed) {
          const targetDate = getLocalIsoDate(toggledBlock.dayOffset || 0);
          const log = ensureDailyLog(targetDate);
          if (toggledBlock.category === 'prayer') log.prayerDone = true;
          else if (toggledBlock.category === 'night') log.nightDone = true;
          else if (toggledBlock.category === 'morning') log.morningDone = true;
          else {
            const exists = (log.todos || []).some((t) => t.text === toggledBlock.title);
            if (!exists) {
              log.todos.push({ id: `dh-${Date.now()}`, text: toggledBlock.title, completed: true });
            }
          }
        }
        saveState();
        renderApp();
      },
      deletePlanBlock(blockId) {
        if (state.planLocked) return showToast('Unlock Watchtower first to remove blocks.');
        state.planBlocks = state.planBlocks.filter((b) => b.id !== blockId);
        saveState();
        renderApp();
      },
      addCustomWatchBlock() {
        if (state.planLocked) return showToast('Unlock Watchtower first to add blocks.');
        const titleEl = document.getElementById('quick-plan-title');
        const timeEl = document.getElementById('quick-plan-time');
        const title = (titleEl?.value || '').trim();
        if (!title) return;
        state.planBlocks.push({
          id: `pb-${Date.now()}`,
          title,
          startTime: timeEl?.value || '15:00',
          durationMins: 25,
          category: 'custom',
          completed: false,
          dayOffset: state.selectedDayOffset > 1 ? 1 : state.selectedDayOffset
        });
        saveState();
        renderApp();
        showToast(`Added "${title}" to 24h Watchtower!`);
      },

      // Workout Planner Actions
      handleWorkoutModalityChange(selectId, customInputId) {
        const sel = document.getElementById(selectId);
        const inp = document.getElementById(customInputId);
        if (!sel || !inp) return;
        if (sel.value === 'Custom / Other...') {
          inp.classList.remove('hidden');
          inp.focus();
        } else {
          inp.classList.add('hidden');
        }
      },
      resolveWorkoutModality(selectId, customInputId) {
        const selVal = document.getElementById(selectId)?.value || 'Indoor Spinning';
        if (selVal === 'Custom / Other...') {
          const customVal = (document.getElementById(customInputId)?.value || '').trim();
          return customVal || 'Custom Workout';
        }
        return selVal;
      },
      createWorkout(markCompletedImmediately = false) {
        const modality = this.resolveWorkoutModality('wk-modality', 'wk-custom-modality');
        const rawTitle = (document.getElementById('wk-title')?.value || '').trim();
        const title = rawTitle || `${modality} Session`;
        const date = document.getElementById('wk-date')?.value || getLocalIsoDate(0);
        const startTime = document.getElementById('wk-time')?.value || '06:00';
        const durationMins = Number(document.getElementById('wk-duration')?.value) || 45;
        const intensity = document.getElementById('wk-intensity')?.value || 'Moderate';
        const videoOrRoute = (document.getElementById('wk-route')?.value || '').trim();
        const notes = (document.getElementById('wk-notes')?.value || '').trim();

        if (!Array.isArray(state.workouts)) state.workouts = [];
        state.workouts.unshift({
          id: `wk-${Date.now()}`,
          date,
          startTime,
          durationMins,
          modality,
          title,
          videoOrRoute,
          intensity,
          notes,
          completed: Boolean(markCompletedImmediately)
        });
        ensureDailyLog(date);
        saveState();
        renderApp();
        showToast(
          markCompletedImmediately
            ? `Logged completed ${modality}: "${title}" on ${date}!`
            : `Scheduled ${modality}: "${title}" on ${date} (${startTime})!`
        );
      },
      toggleWorkoutCompleted(workoutId) {
        state.workouts = (state.workouts || []).map((w) =>
          w.id === workoutId ? { ...w, completed: !w.completed } : w
        );
        saveState();
        renderApp();
        showToast('Updated workout status!');
      },
      deleteWorkout(workoutId) {
        state.workouts = (state.workouts || []).filter((w) => w.id !== workoutId);
        saveState();
        renderApp();
      },
      setWorkoutFilter(mod) {
        state.workoutFilterModality = mod;
        renderApp();
      },

      // Harbor Wall Lists Actions
      createListBoard() {
        const el = document.getElementById('new-board-title');
        const title = (el?.value || '').trim();
        if (!title) return;
        state.lists.push({ id: `list-${Date.now()}`, title, category: 'Household', items: [] });
        saveState();
        renderApp();
        showToast(`Created "${title}" board!`);
      },
      deleteListBoard(boardId) {
        state.lists = state.lists.filter((b) => b.id !== boardId);
        saveState();
        renderApp();
      },
      addListItem(boardId) {
        const el = document.getElementById(`list-input-${boardId}`);
        const text = (el?.value || '').trim();
        if (!text) return;
        state.lists = state.lists.map((b) =>
          b.id === boardId
            ? { ...b, items: [...b.items, { id: `li-${Date.now()}`, text, assignedTo: 'Dan', completed: false, scheduledTime: '15:00' }] }
            : b
        );
        saveState();
        renderApp();
      },
      toggleListItem(boardId, itemId) {
        let completedItemText = null;
        state.lists = state.lists.map((b) =>
          b.id === boardId
            ? {
                ...b,
                items: b.items.map((it) => {
                  if (it.id === itemId) {
                    const nextCompleted = !it.completed;
                    if (nextCompleted) completedItemText = `[${b.title}] ${it.text}`;
                    return { ...it, completed: nextCompleted };
                  }
                  return it;
                })
              }
            : b
        );
        if (completedItemText) {
          const todayLog = ensureDailyLog(getLocalIsoDate(0));
          const exists = (todayLog.todos || []).some((t) => t.text === completedItemText);
          if (!exists) {
            todayLog.todos.push({ id: `dh-${Date.now()}`, text: completedItemText, completed: true });
          }
        }
        saveState();
        renderApp();
      },
      pushListItemToWatch(boardId, itemId) {
        const board = state.lists.find((b) => b.id === boardId);
        const item = board?.items.find((i) => i.id === itemId);
        if (!item) return;
        state.planBlocks.push({
          id: `pb-${Date.now()}`,
          title: `[List] ${item.text}`,
          startTime: item.scheduledTime || '15:00',
          durationMins: 30,
          category: 'list',
          completed: false,
          dayOffset: 0
        });
        saveState();
        showToast(`Added "${item.text}" to 24h Watchtower!`);
      }
    };

    initLighthousePage({
      page: 'index.html',
      defaultTab: 'calendar',
      renderers: {
        calendar: renderWatchtowerView,
        workouts: renderWorkoutsView,
        lists: renderListsView
      },
      actions: pageActions
    });
  </script>
</body>
</html>
